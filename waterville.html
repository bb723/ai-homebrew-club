<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waterville &middot; The AI Homebrew Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="The AI Brown Bag in Waterville">
<meta property="og:description" content="The next meetup, the agenda, and every table we've held. Free, one hour, coffee on.">
<meta property="og:image" content="https://aihomebrewclub.com/invite-card.png">
<meta property="og:url" content="https://aihomebrewclub.com/waterville.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face{font-family:'Nunito'; font-style:normal; font-weight:300 900; font-display:swap; src:url(assets/fonts/nunito.woff2) format('woff2')}
  @font-face{font-family:'Besley'; font-style:normal; font-weight:400 900; font-display:swap; src:url(assets/fonts/besley.woff2) format('woff2')}
  @font-face{font-family:'Besley'; font-style:italic; font-weight:400 900; font-display:swap; src:url(assets/fonts/besley-i.woff2) format('woff2')}
  :root{
    --font-display:'Besley',Georgia,serif;
    --font-body:'Nunito',system-ui,sans-serif;
    --ink:#3B3227; --ink-soft:#675B49; --paper:#F8F1E3; --card:#FFFCF4;
    --teal:#557C4B; --teal-deep:#3E5F37; --tangerine:#C1552F;
    --lemon:#E7B84E; --sky:#567F9E; --berry:#8F5874; --edge:rgba(59,50,39,.18);
    --shadow:0 8px 20px rgba(59,50,39,.13);
    --squig:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='126' height='12'><path d='M3 8 q10 -9 20 0 t20 0 t20 0 t20 0 t20 0' fill='none' stroke='%23C1552F' stroke-width='3.5' stroke-linecap='round'/></svg>");
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F4EAD8; --ink-soft:#C6B79F; --paper:#2A2118; --card:#362B20;
      --teal:#8CB47E; --teal-deep:#AEC99A; --tangerine:#EC8A61;
      --lemon:#EFC96F; --sky:#8FB4CE; --berry:#C48BA8; --edge:rgba(244,234,216,.16);
      --shadow:0 8px 20px rgba(0,0,0,.4);
      --squig:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='126' height='12'><path d='M3 8 q10 -9 20 0 t20 0 t20 0 t20 0 t20 0' fill='none' stroke='%23EC8A61' stroke-width='3.5' stroke-linecap='round'/></svg>");
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:16.5px; line-height:1.6;
    padding-bottom:60px; position:relative;
  }
  body::after{
    content:""; position:fixed; left:0; right:0; bottom:0; height:22px; z-index:5;
    border-top:2px solid var(--edge); background-color:var(--card);
    background-image:
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--tangerine) 22%, transparent) 0 8px, transparent 8px 16px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--tangerine) 22%, transparent) 0 8px, transparent 8px 16px);
  }
  .wrap{width:min(760px,100%); margin:0 auto; padding:0 clamp(14px,3.5vw,24px)}
  header.top{display:flex; align-items:center; gap:12px; padding:20px 0 6px; font-weight:800}
  header.top a{color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:10px}
  h1{font-family:var(--font-display); font-weight:800; font-size:clamp(2.6rem,8vw,4rem); line-height:1.05; margin:18px 0 4px; letter-spacing:-.01em}
  h1::after{content:""; display:block; width:126px; height:12px; margin-top:12px; background:var(--squig) no-repeat left center}
  .kicker{font-family:var(--font-display); font-style:italic; font-weight:600; color:var(--ink-soft); font-size:1.1rem; margin:0 0 22px}
  h2{font-family:var(--font-display); font-weight:800; font-size:clamp(1.5rem,4vw,2rem); margin:36px 0 12px}

  .meetup{
    background:var(--card); border:1px solid var(--edge); border-radius:20px;
    box-shadow:var(--shadow); padding:22px 24px; margin:16px 0;
  }
  .mhead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .mwhen{font-family:var(--font-display); font-weight:800; font-size:clamp(1.3rem,3.4vw,1.7rem)}
  .seats{
    background:var(--lemon); color:#3B3227; border-radius:999px; padding:4px 14px;
    font-weight:800; font-size:.76rem; letter-spacing:.06em; text-transform:uppercase;
  }
  .seats.full{background:var(--tangerine); color:#FFFCF4}
  .mtitle{color:var(--ink-soft); font-weight:800; margin:2px 0 0}
  .mwhere{margin:6px 0 0}
  .ag{margin:16px 0 0; border-top:2px dashed var(--edge)}
  .ag > div{display:flex; gap:16px; padding:10px 2px; border-bottom:2px dashed var(--edge); align-items:baseline}
  .ag .t{font-family:var(--font-display); font-weight:800; color:var(--tangerine); flex:none; width:52px; font-size:.98rem}
  .ag b{font-weight:800}
  .ag .d{color:var(--ink-soft); display:block; font-size:.92rem}
  .aglabel{font-size:.76rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin:16px 0 0}
  .mfoot{display:flex; gap:20px; align-items:center; margin-top:18px; flex-wrap:wrap}
  .gobtn{
    display:inline-block; background:var(--tangerine); color:#FFFCF4; text-decoration:none;
    border-radius:999px; padding:13px 30px; font-weight:800; font-size:1rem;
    letter-spacing:.04em; box-shadow:var(--shadow);
  }
  .gobtn:hover{filter:brightness(1.08)}
  .qrbox{background:#F8F1E3; border:1px solid var(--edge); border-radius:14px; padding:8px; line-height:0}
  .qrbox svg{width:118px; height:118px; display:block}
  .qrcap{font-size:.78rem; color:var(--ink-soft); font-weight:700; max-width:130px}
  .callink{font-weight:800; font-size:.85rem; color:var(--teal-deep)}
  .past .meetup{padding:16px 20px}
  .past summary{cursor:pointer; font-weight:800; color:var(--teal-deep); font-size:.9rem; margin-top:8px}
  .empty{color:var(--ink-soft); font-weight:700}
  footer{padding:44px 0 60px; text-align:center; color:var(--ink-soft); font-weight:700}
  footer a{color:var(--teal-deep)}
  @media (max-width:560px){ .mfoot{gap:14px} .qrbox svg{width:100px;height:100px} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a href="index.html"><span class="logo" id="logo"></span><span>The AI Homebrew Club</span></a>
  </header>

  <h1>Waterville.</h1>
  <p class="kicker">Neighbors teaching neighbors to put AI to work. Free, and it always will be.</p>

  <h2 id="nextH">The next meetup.</h2>
  <div id="nextWrap"><p class="empty">Checking the calendar&hellip;</p></div>

  <div class="past">
    <h2 id="pastH" hidden>The record.</h2>
    <div id="pastWrap"></div>
  </div>

  <footer>
    The recipes are free. They always will be.<br>
    Got a room and a coffee pot? <a href="lend.html?ref=town">Lend it to the club.</a><br>
    <a href="index.html">aihomebrewclub.com</a>
  </footer>
</div>

<script src="assets/qrlib.js"></script>
<script>
(function(){
  'use strict';
  var LOGO = '<svg viewBox="0 0 120 120" width="40" height="40" fill="none" aria-label="Coffee urn logo">' +
    '<rect x="34" y="30" width="48" height="56" rx="9" stroke="var(--ink)" stroke-width="5"/>' +
    '<path d="M40 30 a18 10 0 0 1 36 0" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<circle cx="58" cy="14" r="4.5" fill="var(--tangerine)"/>' +
    '<circle cx="58" cy="64" r="4" fill="var(--sky)"/>' +
    '<path d="M58 68 v10" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M42 86 v9" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M74 86 v9" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M46 46 h24" stroke="var(--teal)" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M46 54 h16" stroke="var(--lemon)" stroke-width="4" stroke-linecap="round"/></svg>';
  document.getElementById('logo').innerHTML = LOGO;

  var BASE = 'https://aihc-notes-690dcde965fd.herokuapp.com/notes'.replace(/\/notes\b.*$/, '');
  var CITY = 'waterville';
  function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
  function fmtTime(t){
    if (!/^\d{1,2}:\d{2}$/.test(t || '')) return '';
    var parts = t.split(':');
    var h = parseInt(parts[0], 10);
    var ap = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return h + ':' + parts[1] + ' ' + ap;
  }

  function qrSvg(url){
    try{
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      return qr.createSvgTag({cellSize: 4, margin: 0, scalable: true})
        .replace(/#000000|black/gi, '#3B3227')
        .replace(/#ffffff|white/gi, '#F8F1E3');
    } catch(e){ return ''; }
  }

  function agendaHtml(items){
    if (!items || !items.length) return '<p class="aglabel">Agenda coming soon. It always fits in one hour.</p>';
    return '<p class="aglabel">The agenda</p><div class="ag">' + items.map(function(a){
      return '<div><span class="t">' + esc(a.t) + '</span><span><b>' + esc(a.title) + '</b>' +
        (a.detail ? '<span class="d">' + esc(a.detail) + '</span>' : '') + '</span></div>';
    }).join('') + '</div>';
  }

  function render(events){
    var up = events.filter(function(e){ return e.status === 'upcoming'; })
      .sort(function(a, b){ return a.sort_date < b.sort_date ? -1 : 1; });
    var past = events.filter(function(e){ return e.status === 'past'; });
    var nw = document.getElementById('nextWrap');
    if (!up.length){
      nw.innerHTML = '<p class="empty">Nothing on the calendar yet. The next date lands here first.</p>';
    } else {
      nw.innerHTML = up.map(function(e){
        var rsvpUrl = 'https://aihomebrewclub.com/rsvp.html?event=' + encodeURIComponent(e.id) + '&ref=qr';
        var pill = e.left > 0
          ? '<span class="seats">' + e.left + ' of ' + e.capacity + ' seats left</span>'
          : '<span class="seats full">Full · waitlist open</span>';
        var timeBit = e.start_time ? ' · ' + fmtTime(e.start_time) : '';
        return '<div class="meetup">' +
          '<div class="mhead"><span class="mwhen">' + esc(e.when) + timeBit + '</span>' + pill + '</div>' +
          '<p class="mtitle">' + esc(e.title) + '</p>' +
          '<p class="mwhere">' + esc(e.location) + '</p>' +
          agendaHtml(e.agenda) +
          '<div class="mfoot">' +
            '<a class="gobtn" href="rsvp.html?event=' + encodeURIComponent(e.id) + '&ref=town">' +
              (e.left > 0 ? 'Save my seat' : 'Join the waitlist') + '</a>' +
            (e.gcal ? '<a class="callink" target="_blank" rel="noopener" href="' + esc(e.gcal) + '">Add to calendar</a>' : '') +
            '<span class="qrbox">' + qrSvg(rsvpUrl) + '</span>' +
            '<span class="qrcap">Scan to RSVP, or screenshot this and text a neighbor.</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    if (past.length){
      document.getElementById('pastH').hidden = false;
      document.getElementById('pastWrap').innerHTML = past.map(function(e){
        return '<div class="meetup">' +
          '<div class="mhead"><span class="mwhen">' + esc(e.when) + '</span></div>' +
          '<p class="mtitle">' + esc(e.title) + ' &middot; ' + esc(e.location) + '</p>' +
          (e.agenda && e.agenda.length
            ? '<details><summary>What we worked on</summary>' + agendaHtml(e.agenda) + '</details>'
            : '') +
        '</div>';
      }).join('');
    }
  }

  fetch(BASE + '/events?city=' + CITY)
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.events) render(d.events); })
    .catch(function(){
      document.getElementById('nextWrap').innerHTML =
        '<p class="empty">Could not reach the calendar. RSVP still works at <a href="rsvp.html">the RSVP page</a>.</p>';
    });
})();
</script>
</body>
</html>
