<script>
(function(){
  'use strict';
  var LOGO = '<svg viewBox="0 0 120 120" width="40" height="40" fill="none" aria-label="Coffee urn logo">' +
    '<rect x="34" y="30" width="48" height="56" rx="9" stroke="var(--ink)" stroke-width="5"/>' +
    '<path d="M40 30 a18 10 0 0 1 36 0" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<circle cx="58" cy="14" r="4.5" fill="var(--tangerine)"/>' +
    '<circle cx="58" cy="64" r="4" fill="var(--sky)"/>' +
    '<path d="M58 68 v10" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M42 86 v9" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M74 86 v9" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>' +
    '<path d="M46 46 h24" stroke="var(--teal)" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M46 54 h16" stroke="var(--lemon)" stroke-width="4" stroke-linecap="round"/></svg>';
  document.getElementById('logo').innerHTML = LOGO;

  var BASE = 'https://aihc-notes-690dcde965fd.herokuapp.com/notes'.replace(/\/notes\b.*$/, '');
  var CITY = 'waterville';
  function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

  function qrSvg(url){
    try{
      var qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
      return qr.createSvgTag({cellSize: 4, margin: 0, scalable: true})
        .replace(/#000000|black/gi, '#3B3227')
        .replace(/#ffffff|white/gi, '#F8F1E3');
    } catch(e){ return ''; }
  }

  function agendaHtml(items){
    if (!items || !items.length) return '<p class="aglabel">Agenda coming soon. It always fits in one hour.</p>';
    return '<p class="aglabel">The agenda</p><div class="ag">' + items.map(function(a){
      return '<div><span class="t">' + esc(a.t) + '</span><span><b>' + esc(a.title) + '</b>' +
        (a.detail ? '<span class="d">' + esc(a.detail) + '</span>' : '') + '</span></div>';
    }).join('') + '</div>';
  }

  function render(events){
    var up = events.filter(function(e){ return e.status === 'upcoming'; })
      .sort(function(a, b){ return a.sort_date < b.sort_date ? -1 : 1; });
    var past = events.filter(function(e){ return e.status === 'past'; });
    var nw = document.getElementById('nextWrap');
    if (!up.length){
      nw.innerHTML = '<p class="empty">Nothing on the calendar yet. The next date lands here first.</p>';
    } else {
      nw.innerHTML = up.map(function(e){
        var rsvpUrl = 'https://aihomebrewclub.com/rsvp.html?event=' + encodeURIComponent(e.id);
        var pill = e.left > 0
          ? '<span class="seats">' + e.left + ' of ' + e.capacity + ' seats left</span>'
          : '<span class="seats full">Full · waitlist open</span>';
        return '<div class="meetup">' +
          '<div class="mhead"><span class="mwhen">' + esc(e.when) + '</span>' + pill + '</div>' +
          '<p class="mtitle">' + esc(e.title) + '</p>' +
          '<p class="mwhere">' + esc(e.location) + '</p>' +
          agendaHtml(e.agenda) +
          '<div class="mfoot">' +
            '<a class="gobtn" href="rsvp.html?event=' + encodeURIComponent(e.id) + '">' +
              (e.left > 0 ? 'Save my seat' : 'Join the waitlist') + '</a>' +
            '<span class="qrbox">' + qrSvg(rsvpUrl) + '</span>' +
            '<span class="qrcap">Scan to RSVP, or screenshot this and text a neighbor.</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    if (past.length){
      document.getElementById('pastH').hidden = false;
      document.getElementById('pastWrap').innerHTML = past.map(function(e){
        return '<div class="meetup">' +
          '<div class="mhead"><span class="mwhen">' + esc(e.when) + '</span></div>' +
          '<p class="mtitle">' + esc(e.title) + ' &middot; ' + esc(e.location) + '</p>' +
          (e.agenda && e.agenda.length
            ? '<details><summary>What we worked on</summary>' + agendaHtml(e.agenda) + '</details>'
            : '') +
        '</div>';
      }).join('');
    }
  }

  fetch(BASE + '/events?city=' + CITY)
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.events) render(d.events); })
    .catch(function(){
      document.getElementById('nextWrap').innerHTML =
        '<p class="empty">Could not reach the calendar. RSVP still works at <a href="rsvp.html">the RSVP page</a>.</p>';
