<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The AI Homebrew Club &middot; The Clubhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="The clubhouse &middot; The AI Homebrew Club">
<meta property="og:description" content="Where members keep talking between meetups. Members only.">
<meta property="og:image" content="https://aihomebrewclub.com/invite-card.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/club.css">
</head>
<body>

<!-- ===================== GATE ===================== -->
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <span class="logo" data-size="90" aria-hidden="true"></span>
    <h2>Friends only, for now</h2>
    <p>This is the members' clubhouse. Tell us who you are and the secret word from the meetup.</p>
    <input id="gName" type="text" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <input id="gPass" type="password" placeholder="Secret word" autocomplete="off" aria-label="Secret word">
    <p class="err" id="gErr" role="alert"></p>
    <button id="gGo">Come on in</button>
  </div>
</div>

<div class="deck" id="deck">
<style>
  /* clubhouse-only styles: this block ships only with chat.html, so bare overrides are safe */
  html{scroll-snap-type:none}
  .slide{min-height:100svh; display:block; padding:0; background:var(--w-cream)}
  #s1::after{display:none} /* the tablecloth moved: it lives above the composer now */
  .rail,.hint,.notesbtn,.clickhint{display:none} /* one screen, no slides to pin notes on */
  .sidepane{display:none!important} /* the notes pane has no business in the clubhouse */
  body.pane-open .deck{margin-right:0}

  .avatar{
    border-radius:50%; flex:none; display:grid; place-items:center;
    font-weight:800; font-family:var(--font-body); color:var(--paper);
  }
  .c0{background:var(--teal)} .c1{background:var(--sky)} .c2c{background:var(--berry)}
  .c3{background:var(--lemon); color:#3B3227} .c4{background:var(--tangerine)}

  .chatapp{
    width:100%; /* quirks mode shrink-wraps block grids; be explicit */
    height:100svh; height:100dvh;
    display:grid; grid-template-columns:290px 1fr;
  }

  /* ---- the rail: rooms, the board, who's around ---- */
  .chanrail{
    background:var(--card); border-right:1px solid var(--edge);
    display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden;
    padding:18px 14px 14px;
  }
  .railhead{padding:0 10px 12px 56px; border-bottom:2px dashed var(--edge)}
  .railhead .rh{display:flex; align-items:center; gap:10px}
  .railhead b{font-family:var(--font-display); font-size:1.4rem; line-height:1.1}
  .railhead .rh::after{content:none}
  .railsquig{display:block; width:96px; height:12px; margin-top:8px; background:var(--squig) no-repeat left center; background-size:126px 12px}
  .livedot{
    margin-left:auto; font-size:.64rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 10px; border-radius:999px; background:var(--paper); color:var(--ink-soft); flex:none;
  }
  .livedot.on{background:var(--teal); color:#fff}
  .railgroup{
    font-family:var(--font-display); font-weight:800; font-size:.78rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); padding:16px 10px 7px;
  }
  .chan{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:none; border:none; border-radius:14px; padding:10px 12px; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.98rem; color:var(--ink);
  }
  .chan:hover{background:var(--paper)}
  .chan.here{background:var(--w-mint); font-weight:800; box-shadow:inset 3px 0 0 var(--teal)}
  .chan .rdot{width:10px; height:10px; border-radius:50%; flex:none}
  .chan .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .chan .boardico{
    width:24px; height:24px; border-radius:50%; flex:none; background:var(--tangerine);
    display:grid; place-items:center; font-size:.8rem;
  }
  .chan .dot{
    margin-left:auto; flex:none; width:10px; height:10px; border-radius:999px;
    background:var(--lemon); border:2px solid var(--lemon-deep);
  }
  .who{display:flex; align-items:center; gap:9px; padding:7px 12px; font-size:.9rem; font-weight:700}
  .who .avatar{width:28px; height:28px; font-size:.74rem}
  .who .wch{margin-left:auto; color:var(--ink-soft); font-size:.74rem; font-style:italic; font-family:var(--font-display)}
  .who .on{width:8px; height:8px; border-radius:50%; background:var(--teal); flex:none}
  .railempty{color:var(--ink-soft); font-size:.84rem; font-weight:700; padding:4px 12px}

  /* ---- main column ---- */
  .chatmain{display:flex; flex-direction:column; min-width:0; min-height:0}
  .chanhead{
    display:flex; align-items:baseline; gap:12px; padding:16px 24px 12px 24px;
    background:var(--card); border-bottom:1px solid var(--edge); box-shadow:var(--shadow);
    position:relative; z-index:2;
  }
  .chanhead b{font-family:var(--font-display); font-size:1.45rem; letter-spacing:-.01em}
  .chanhead .topic{
    font-family:'Caveat',cursive; font-weight:600; font-size:1.25rem; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transform:rotate(-.5deg);
  }
  .chanhead .onl{
    margin-left:auto; flex:none; font-size:.74rem; font-weight:800; letter-spacing:.05em;
    text-transform:uppercase; color:var(--teal-deep); background:var(--w-mint);
    border-radius:999px; padding:4px 12px;
  }
  .railtog{
    display:none; border:none; background:var(--paper); border-radius:10px; padding:6px 12px;
    font-family:var(--font-body); font-weight:800; cursor:pointer; color:var(--ink); font-size:1rem; flex:none;
    align-self:center;
  }

  .msgscroll{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px 24px 30px}
  /* wide room, readable measure: everything in the stream sits in a centered column */
  .msgscroll > *{max-width:880px; margin-left:auto; margin-right:auto}
  .chatstate{text-align:center; color:var(--ink-soft); font-weight:700; font-size:.9rem; padding:30px 0}
  .daymark{
    text-align:center; font-family:var(--font-display); font-style:italic; font-weight:600;
    font-size:.85rem; color:var(--ink-soft); margin:20px auto 8px;
  }
  .daymark::after{
    content:""; display:block; width:126px; height:12px; margin:4px auto 0;
    background:var(--squig) no-repeat center; opacity:.55;
  }

  .mrow{display:flex; gap:12px; padding:4px 10px; border-radius:14px; position:relative}
  .mrow:hover{background:color-mix(in srgb, var(--card) 70%, transparent)}
  .mrow.mention-me{background:var(--w-lemon)}
  .mrow .avatar{width:38px; height:38px; margin-top:3px; font-size:.92rem}
  .mrow .spacer{width:38px; flex:none}
  .mrow.grouped{padding-top:0}
  @media (prefers-reduced-motion: no-preference){
    .mrow.new{animation:arrive .28s ease}
    @keyframes arrive{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  }
  .mcol{min-width:0; flex:1}
  .mhead{display:flex; align-items:baseline; gap:9px}
  .mhead b{font-size:.97rem}
  .mtime{font-size:.72rem; color:var(--ink-soft); font-weight:700}
  .mbody{font-size:.97rem; overflow-wrap:break-word}
  .mbody p{margin:0 0 4px} .mbody p:last-child{margin-bottom:0}
  .mbody ul{margin:2px 0 6px; padding-left:20px}
  .mention{background:var(--w-lemon); border-radius:6px; padding:0 4px; font-weight:800; color:var(--tangerine-deep)}
  .pending{opacity:.55}

  .mchips{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px}
  .rchip{
    border:1px solid var(--edge); background:var(--paper); border-radius:999px;
    padding:2px 11px; font-family:var(--font-body); font-weight:800; font-size:.82rem;
    cursor:pointer; color:var(--ink);
  }
  .rchip.on{border-color:var(--lemon-deep); background:var(--w-lemon)}
  .tchip{
    border:none; background:none; padding:2px 4px; cursor:pointer;
    font-family:var(--font-body); font-weight:800; font-size:.82rem; color:var(--teal-deep);
  }
  .tchip:hover{text-decoration:underline}

  .mact{
    position:absolute; right:10px; top:-14px; display:none; gap:2px;
    background:var(--card); border:1px solid var(--edge); border-radius:999px; padding:2px 7px;
    box-shadow:var(--shadow); z-index:3;
  }
  .mrow:hover .mact{display:flex}
  @media (hover:none){ .mact{display:flex; opacity:.85} }
  .mact button{
    border:none; background:none; cursor:pointer; font-size:.95rem; padding:3px 6px;
    color:var(--ink-soft); font-family:var(--font-body); font-weight:800;
  }
  .mact button:hover{color:var(--ink)}

  .emojipick{
    position:fixed; z-index:120; background:var(--card); border:1px solid var(--edge);
    border-radius:999px; padding:6px 10px; box-shadow:0 16px 40px rgba(0,0,0,.25); display:flex; gap:2px;
  }
  .emojipick button{border:none; background:none; font-size:1.3rem; cursor:pointer; padding:3px 7px; border-radius:8px}
  .emojipick button:hover{background:var(--paper)}

  /* ---- the bulletin board: club feed cards inside the clubhouse ---- */
  .post{
    background:var(--card); border:1px solid var(--edge); border-radius:18px;
    box-shadow:var(--shadow); padding:16px 18px 10px; margin:14px auto;
    max-width:720px!important;
  }
  .phead{display:flex; align-items:center; gap:11px; margin-bottom:8px}
  .phead .avatar{width:44px; height:44px; font-size:1.02rem}
  .pwho{min-width:0}
  .pwho b{display:block; font-size:.98rem; line-height:1.25}
  .pmeta{font-size:.8rem; color:var(--ink-soft); font-weight:700}
  .pill{
    margin-left:auto; flex:none; background:var(--lemon); color:#3B3227;
    border-radius:999px; padding:3px 11px; font-size:.68rem; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .ptitle{font-family:var(--font-display); font-weight:800; font-size:1.22rem; line-height:1.2; margin:0 0 6px}
  .pbody{font-size:.96rem}
  .pbody p{margin:0 0 9px}
  .pbody ul{margin:0 0 9px; padding-left:20px}
  .pmore{display:none; border-left:3px solid var(--edge); padding-left:14px; margin:4px 0 8px}
  .post.open .pmore{display:block}
  .morebtn{
    background:none; border:none; padding:0 0 8px; cursor:pointer;
    font-family:var(--font-body); font-weight:800; font-size:.85rem; color:var(--teal-deep);
  }
  .morebtn::before{content:"\25B8  "; font-size:.75rem}
  .post.open .morebtn::before{content:"\25BE  "}
  .pfoot{
    border-top:2px dashed var(--edge); padding-top:7px; margin-top:2px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:baseline;
    font-size:.78rem; color:var(--ink-soft); font-weight:700;
  }
  .tag{color:var(--teal-deep); font-weight:800}
  .delbtn{
    margin-left:auto; background:none; border:none; padding:0; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.76rem; color:var(--ink-soft);
  }
  .delbtn:hover{color:var(--tangerine)}
  .fmsg{
    max-width:88%; padding:10px 13px; border-radius:15px; margin:9px 0;
    border:1px solid var(--edge); font-size:.92rem;
  }
  .fmsg .m{font-size:.7rem; color:var(--ink-soft); margin-bottom:4px; font-weight:800; letter-spacing:.04em; text-transform:uppercase}
  .fmsg p{margin:0 0 8px}
  .fmsg p:last-child{margin-bottom:0}
  .fmsg.them{background:var(--w-sky); border-bottom-left-radius:5px}
  .fmsg.me{background:var(--w-mint); margin-left:auto; border-bottom-right-radius:5px}

  /* ---- the composer sits at the gingham table edge ---- */
  .composerbar{
    padding:14px 24px calc(16px + env(safe-area-inset-bottom)); background:var(--card);
    position:relative;
  }
  .composerbar::before{
    content:""; position:absolute; left:0; right:0; top:-20px; height:20px;
    border-top:2px solid var(--edge); pointer-events:none;
    background-color:var(--card);
    background-image:
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--tangerine) 22%, transparent) 0 8px, transparent 8px 16px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--tangerine) 22%, transparent) 0 8px, transparent 8px 16px);
  }
  .composerbar .row{display:flex; gap:10px; align-items:flex-end; max-width:880px; margin:0 auto}
  .composerbar textarea{
    flex:1; min-height:46px; max-height:150px; resize:none; border:1px solid var(--edge);
    border-radius:16px; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:.97rem; line-height:1.45; padding:12px 15px;
  }
  .composerbar textarea:focus{outline:2px solid var(--teal)}
  .sendbtn{
    background:var(--tangerine); color:#fff; border:none; border-radius:999px; flex:none;
    padding:12px 24px; font-family:var(--font-display); font-weight:800; font-size:.95rem;
    cursor:pointer;
  }
  .sendbtn:hover{filter:brightness(1.06)}
  .sendbtn:disabled{opacity:.45; cursor:default}
  .mentionpick{
    position:absolute; bottom:100%; left:24px; margin-bottom:24px; z-index:110;
    background:var(--card); border:1px solid var(--edge); border-radius:14px;
    box-shadow:0 16px 40px rgba(0,0,0,.25); overflow:hidden; min-width:210px;
  }
  .mentionpick button{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none;
    background:none; padding:9px 13px; cursor:pointer; font-family:var(--font-body);
    font-weight:700; font-size:.92rem; color:var(--ink);
  }
  .mentionpick button.sel, .mentionpick button:hover{background:var(--w-mint)}
  .mentionpick .avatar{width:26px; height:26px; font-size:.7rem}

  /* ---- thread pane ---- */
  .threadpane{
    position:fixed; top:0; right:0; bottom:0; width:min(420px,100vw); z-index:60;
    background:var(--card); box-shadow:-8px 0 30px rgba(0,0,0,.18);
    display:flex; flex-direction:column;
  }
  .threadpane[hidden]{display:none}
  .threadpane > header{
    padding:16px 18px 10px; display:flex; align-items:baseline; gap:10px;
    border-bottom:2px dashed var(--edge);
  }
  .threadpane > header h3{font-size:1.25rem}
  .threadpane > header .quiet{font-size:.82rem; font-weight:700}
  .threadpane .close{
    margin-left:auto; border:none; background:none; color:var(--ink-soft);
    font-weight:800; cursor:pointer; font-size:1.05rem; padding:2px 6px;
  }
  .threadpane .close:hover{color:var(--ink)}
  .tscroll{flex:1; overflow-y:auto; overscroll-behavior:contain; padding:12px 16px}
  .troot{border-bottom:2px dashed var(--edge); padding-bottom:10px; margin-bottom:10px}
  .threadpane .composerbar{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .threadpane .composerbar .row{max-width:none}

  /* ---- phones: rail becomes a drawer, thread goes full screen ---- */
  @media (max-width:860px){
    .chatapp{grid-template-columns:1fr}
    .chanrail{
      position:fixed; left:0; top:0; bottom:0; z-index:65; width:min(310px,86vw);
      box-shadow:8px 0 30px rgba(0,0,0,.18); transform:translateX(-105%);
    }
    body.rail-open .chanrail{transform:none}
    @media (prefers-reduced-motion: no-preference){ .chanrail{transition:transform .22s} }
    .railtog{display:inline-block}
    .chanhead{padding:14px 14px 10px 72px}
    .chanhead b{font-size:1.2rem}
    .chanhead .topic{display:none}
    .threadpane{width:100vw}
    .msgscroll{padding:14px 12px 26px}
    .composerbar{padding-left:12px; padding-right:12px}
  }
  @media (min-width:861px){
    .chanhead{padding-left:24px}
  }
</style>

<!-- the whole clubhouse is one slide: rail, the stream, and a thread drawer -->
<section class="slide" id="s1" data-title="The clubhouse">
  <div class="chatapp" id="chatApp">
    <aside class="chanrail" id="chanRail">
      <div class="railhead">
        <span class="rh"><b>The clubhouse</b><span class="livedot" id="liveDot">connecting</span></span>
        <span class="railsquig"></span>
      </div>
      <div class="railgroup">The bulletin board</div>
      <div id="boardEntry"></div>
      <div class="railgroup">Rooms</div>
      <div id="chanList"><div class="railempty">Setting the table&hellip;</div></div>
      <div class="railgroup">Here now</div>
      <div id="whosHere"><div class="railempty">Just you, so far.</div></div>
    </aside>
    <div class="chatmain">
      <header class="chanhead">
        <button class="railtog" id="railTog" type="button" aria-label="Rooms">#</button>
        <b id="chanName">#general</b>
        <span class="topic" id="chanTopic"></span>
        <span class="onl" id="onlCount" hidden></span>
      </header>
      <div class="msgscroll" id="msgScroll"><div class="chatstate">Pouring the coffee&hellip;</div></div>
      <div class="composerbar">
        <div class="mentionpick" id="mentionPick" hidden></div>
        <div class="row">
          <textarea id="chatText" maxlength="4000" rows="1" placeholder="Say something to the room&hellip;"></textarea>
          <button class="sendbtn" id="chatSend" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="threadpane" id="threadPane" hidden>
    <header>
      <h3>Thread</h3><span class="quiet" id="threadChan"></span>
      <button class="close" id="threadClose" type="button" aria-label="Close thread">&#10005;</button>
    </header>
    <div class="tscroll" id="threadScroll"></div>
    <div class="composerbar">
      <div class="row">
        <textarea id="threadText" maxlength="4000" rows="1" placeholder="Reply in thread&hellip;"></textarea>
        <button class="sendbtn" id="threadSend" type="button">Reply</button>
      </div>
    </div>
  </aside>
</section>

<script>
(function(){
  'use strict';
  function boot(){
    if (!window.AIHC || !window.AIHC.viewer()){ setTimeout(boot, 300); return; }
    var A = window.AIHC;
    var BASE = String(A.sync || '').replace(/\/notes\b.*$/, '');
    if (!/^https?:/.test(BASE)) return; /* no backend configured: leave the loading note */
    var WS_URL = BASE.replace(/^http/, 'ws') + '/chat/ws';
    var LS_READ = 'aihc_chat_read_v1';
    var EMOJI = ['👍','❤️','😂','🎉','🍺','🤯'];
    var BOARD = '~feed'; /* pseudo-room for the club feed; slugs can never collide with it */

    function $(id){ return document.getElementById(id); }
    function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

    /* ---------- state ---------- */
    var channels = [];            /* open channels from the server, sidebar order */
    var msgs = {};                /* channel id -> sorted message array */
    var loaded = {};              /* channel id -> history fetched */
    var reacts = {};              /* message id -> [{name, emoji}] */
    var latest = {};              /* channel id -> newest ts, for unread dots */
    var who = [];                 /* presence: [{name, channel}] */
    var cur = 'general';
    var openThread = null;        /* parent message id, or null */
    var read = {};
    try { read = JSON.parse(localStorage.getItem(LS_READ) || '{}'); } catch(e){ read = {}; }
    /* the board */
    var posts = [];
    var postsLoaded = false;
    var tableInfo = null;         /* {events, attendees} for the who's-coming card */
    var openIds = {};             /* drilled-open feed posts, survives re-render */

    /* ---------- tiny renderers borrowed from the feed ---------- */
    function md(t){
      var out = [], list = null;
      String(t).split('\n').forEach(function(raw){
        var ln = esc(raw)
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/(https?:\/\/[^\s<]+)/g, function(u){
            return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\//, '') + '</a>';
          });
        if (/^- /.test(raw)){
          if (!list){ list = []; out.push(list); }
          list.push(ln.replace(/^- /, ''));
        } else {
          list = null;
          if (raw.trim()) out.push('<p>' + ln + '</p>');
        }
      });
      return out.map(function(x){
        return Array.isArray(x) ? '<ul><li>' + x.join('</li><li>') + '</li></ul>' : x;
      }).join('');
    }
    function avClass(name){
      var n = String(name).toLowerCase();
      if (n === 'the club') return 'c4';
      var h = 0;
      for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
      return ['c0', 'c1', 'c2c', 'c3'][h % 4];
    }
    function avGlyph(name){
      return String(name).toLowerCase() === 'the club' ? '☕' : esc(String(name).trim().charAt(0).toUpperCase());
    }
    function tOnly(ts){
      var d = new Date(ts);
      return isNaN(d) ? '' : d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase();
    }
    function dayOf(ts){
      var d = new Date(ts);
      return isNaN(d) ? '' : d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
    }
    function when(ts){
      var d = new Date(ts);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) + ' · ' +
        d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase();
    }

    /* ---------- mentions: names we know = authors + everyone here now ---------- */
    var knownNames = {};
    function learnName(n){ if (n && n !== 'The club') knownNames[String(n)] = true; }
    learnName(A.viewer().name);
    function mentionize(html){
      var names = Object.keys(knownNames).sort(function(a, b){ return b.length - a.length; });
      if (!names.length) return html;
      var alt = names.map(function(n){ return esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
      var re = new RegExp('@(' + alt + ')', 'gi');
      return html.replace(re, function(m, n){ return '<span class="mention">@' + n + '</span>'; });
    }
    function mentionsMe(body){
      return String(body).toLowerCase().indexOf('@' + String(A.viewer().name).toLowerCase()) !== -1;
    }

    /* ---------- message store ---------- */
    function upsertMsg(m){
      learnName(m.name);
      var list = msgs[m.channel] || (msgs[m.channel] = []);
      for (var i = 0; i < list.length; i++){
        if (list[i].id === m.id){ list[i] = m; return; }
      }
      list.push(m);
      list.sort(function(a, b){ return a.ts < b.ts ? -1 : 1; });
      if (!latest[m.channel] || m.ts > latest[m.channel]) latest[m.channel] = m.ts;
    }
    function dropMsg(id, channel){
      if (msgs[channel]) msgs[channel] = msgs[channel].filter(function(m){ return m.id !== id && m.parent !== id; });
      delete reacts[id];
    }
    function replyCount(id, channel){
      return (msgs[channel] || []).filter(function(m){ return m.parent === id; }).length;
    }
    function markRead(){
      if (document.visibilityState !== 'visible') return;
      if (latest[cur] && (!read[cur] || latest[cur] > read[cur])){
        read[cur] = latest[cur];
        try { localStorage.setItem(LS_READ, JSON.stringify(read)); } catch(e){}
        renderRail();
      }
    }

    /* ---------- rendering ---------- */
    function chanById(id){
      for (var i = 0; i < channels.length; i++) if (channels[i].id === id) return channels[i];
      return null;
    }
    function hasUnread(id){
      return latest[id] && (!read[id] || latest[id] > read[id]) && id !== cur;
    }
    function renderRail(){
      $('boardEntry').innerHTML =
        '<button class="chan' + (cur === BOARD ? ' here' : '') + '" type="button" data-chan="' + BOARD + '">' +
          '<span class="boardico">☕</span><span class="nm">The feed</span>' +
          (hasUnread(BOARD) ? '<span class="dot"></span>' : '') +
        '</button>';
      if (!channels.length){ $('chanList').innerHTML = '<div class="railempty">No rooms yet.</div>'; return; }
      $('chanList').innerHTML = channels.map(function(c){
        return '<button class="chan' + (c.id === cur ? ' here' : '') + '" type="button" data-chan="' + esc(c.id) + '">' +
          '<span class="rdot ' + avClass(c.id) + '"></span><span class="nm">#' + esc(c.name) + '</span>' +
          (hasUnread(c.id) ? '<span class="dot"></span>' : '') +
        '</button>';
      }).join('');
    }
    function renderPresence(){
      var seen = {}, rows = [];
      who.forEach(function(w){
        if (seen[w.name]) return;
        seen[w.name] = true;
        var c = chanById(w.channel);
        var where = w.channel === BOARD ? 'the board' : (c ? '#' + c.name : '');
        rows.push('<div class="who"><span class="on"></span>' +
          '<span class="avatar ' + avClass(w.name) + '">' + avGlyph(w.name) + '</span>' +
          '<span>' + esc(w.name) + '</span>' +
          (where ? '<span class="wch">' + esc(where) + '</span>' : '') +
        '</div>');
      });
      $('whosHere').innerHTML = rows.length ? rows.join('') : '<div class="railempty">Just you, so far.</div>';
      var inRoom = who.filter(function(w){ return w.channel === cur; }).length;
      $('onlCount').hidden = !inRoom;
      $('onlCount').textContent = inRoom + ' here';
    }
    function reactChips(id){
      var rs = reacts[id] || [];
      if (!rs.length) return '';
      var byEmoji = {};
      rs.forEach(function(r){ (byEmoji[r.emoji] || (byEmoji[r.emoji] = [])).push(r.name); });
      var me = A.viewer().name;
      return Object.keys(byEmoji).map(function(e){
        var names = byEmoji[e];
        var mine = names.indexOf(me) !== -1;
        return '<button class="rchip' + (mine ? ' on' : '') + '" type="button" data-react="' + esc(e) + '" ' +
          'title="' + esc(names.join(', ')) + '">' + esc(e) + ' ' + names.length + '</button>';
      }).join('');
    }
    function msgRow(m, prev, inThread){
      var grouped = prev && prev.name === m.name && prev.parent === m.parent &&
        (new Date(m.ts) - new Date(prev.ts)) < 5 * 60000;
      var mine = m.name === A.viewer().name;
      var replies = !inThread && !m.parent ? replyCount(m.id, m.channel) : 0;
      var body = mentionize(md(m.body));
      return '<div class="mrow' + (grouped ? ' grouped' : '') +
          (m.pending ? ' pending' : '') +
          (!mine && mentionsMe(m.body) ? ' mention-me' : '') + '" data-id="' + esc(m.id) + '">' +
        (grouped ? '<span class="spacer"></span>'
                 : '<span class="avatar ' + avClass(m.name) + '">' + avGlyph(m.name) + '</span>') +
        '<div class="mcol">' +
          (grouped ? '' : '<div class="mhead"><b>' + esc(m.name) + '</b><span class="mtime">' + tOnly(m.ts) + '</span></div>') +
          '<div class="mbody">' + body + '</div>' +
          (reactChips(m.id) || replies ?
            '<div class="mchips">' + reactChips(m.id) +
              (replies ? '<button class="tchip" type="button" data-thread="' + esc(m.id) + '">' +
                replies + (replies === 1 ? ' reply' : ' replies') + ' &rarr;</button>' : '') +
            '</div>' : '') +
        '</div>' +
        '<div class="mact">' +
          '<button type="button" data-act="react" title="React">&#9786;</button>' +
          (!inThread && !m.parent ? '<button type="button" data-act="reply" title="Reply in thread">&#8617;</button>' : '') +
          (mine && !m.pending ? '<button type="button" data-act="del" title="Delete">&#10005;</button>' : '') +
        '</div>' +
      '</div>';
    }
    function renderMsgs(){
      if (cur === BOARD){ renderBoard(); return; }
      var box = $('msgScroll');
      var stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      var list = (msgs[cur] || []).filter(function(m){ return !m.parent; });
      if (!list.length){
        box.innerHTML = '<div class="chatstate">' +
          (loaded[cur] ? 'Nothing said in here yet. Break the ice.' : 'Pouring the coffee&hellip;') + '</div>';
        return;
      }
      var out = [], prev = null, prevDay = '';
      list.forEach(function(m){
        var d = dayOf(m.ts);
        if (d !== prevDay){ out.push('<div class="daymark">' + esc(d) + '</div>'); prevDay = d; prev = null; }
        out.push(msgRow(m, prev, false));
        prev = m;
      });
      box.innerHTML = out.join('');
      if (stick) box.scrollTop = box.scrollHeight;
      markRead();
    }
    function renderThread(){
      var pane = $('threadPane');
      if (!openThread){ pane.hidden = true; return; }
      var all = msgs[cur] || [];
      var root = null;
      all.forEach(function(m){ if (m.id === openThread) root = m; });
      if (!root){ openThread = null; pane.hidden = true; return; }
      pane.hidden = false;
      var c = chanById(cur);
      $('threadChan').textContent = c ? '#' + c.name : '';
      var out = ['<div class="troot">' + msgRow(root, null, true) + '</div>'];
      var prev = null;
      all.filter(function(m){ return m.parent === openThread; }).forEach(function(m){
        out.push(msgRow(m, prev, true));
        prev = m;
      });
      var box = $('threadScroll');
      var stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      box.innerHTML = out.join('');
      if (stick) box.scrollTop = box.scrollHeight;
    }
    function renderHead(){
      if (cur === BOARD){
        $('chanName').textContent = 'The bulletin board';
        $('chanTopic').textContent = 'What happened, and who said yes.';
        $('chatText').placeholder = 'Post it to the club…';
        return;
      }
      var c = chanById(cur);
      $('chanName').textContent = '#' + (c ? c.name : cur);
      $('chanTopic').textContent = c ? c.topic : '';
      $('chatText').placeholder = 'Say something to #' + (c ? c.name : cur) + '…';
    }
    function renderAll(){ renderRail(); renderPresence(); renderHead(); renderMsgs(); renderThread(); }

    /* ---------- the bulletin board: feed posts as cards ---------- */
    function renderMore(p){
      if (p.kind === 'thread'){
        var data = null;
        try { data = JSON.parse(p.more); } catch(e){}
        if (!data || !data.messages) return '';
        return data.messages.map(function(m){
          return '<div class="fmsg ' + (m.side === 'me' ? 'me' : 'them') + '">' +
            '<div class="m">' + esc(m.meta) + '</div>' + md(m.text) + '</div>';
        }).join('');
      }
      return md(p.more);
    }
    function tableCard(){
      if (!tableInfo) return '';
      var events = tableInfo.events, att = tableInfo.attendees;
      if (!events.length) return '';
      var inner = events.map(function(e){
        var mine = att.filter(function(a){ return a.event === e.id; });
        var seats = mine.filter(function(a){ return a.status === 'seat'; });
        var waits = mine.filter(function(a){ return a.status === 'waitlist'; });
        function names(list){
          return list.map(function(a){ return esc(a.name) + (a.biz ? ' (' + esc(a.biz) + ')' : ''); }).join(', ');
        }
        return '<p><b>' + esc(e.when) + '</b> · ' + esc(e.location) + '</p>' +
          (seats.length
            ? '<p>At the table (' + seats.length + ' of ' + e.capacity + '): ' + names(seats) + '</p>'
            : '<p>No seats claimed yet. Be the first.</p>') +
          (waits.length ? '<p class="quiet">Waiting for a seat: ' + names(waits) + '</p>' : '') +
          (e.left > 0
            ? '<p class="quiet">' + e.left + ' seat' + (e.left === 1 ? '' : 's') + ' open · <a href="rsvp.html?event=' + encodeURIComponent(e.id) + '">save one</a></p>'
            : '<p class="quiet">Full · <a href="rsvp.html?event=' + encodeURIComponent(e.id) + '">join the waitlist</a></p>');
      }).join('<hr style="border:none; border-top:2px dashed var(--edge); margin:10px 0">');
      return '<article class="post">' +
        '<div class="phead"><span class="avatar c4">☕</span>' +
        '<span class="pwho"><b>The table</b><span class="pmeta">who&rsquo;s coming</span></span></div>' +
        '<div class="pbody">' + inner + '</div></article>';
    }
    function renderBoard(){
      var box = $('msgScroll');
      var stickTop = box.scrollTop < 60; /* the board reads newest-first from the top */
      if (!postsLoaded){
        box.innerHTML = '<div class="chatstate">Unpinning the notices&hellip;</div>';
        return;
      }
      var cards = posts.map(function(p){
        var hasMore = p.more && String(p.more).trim();
        var moreLabel = p.kind === 'thread' ? 'Read the thread' : 'Show more';
        if (p.kind === 'thread'){
          try { moreLabel += ' (' + JSON.parse(p.more).messages.length + ' messages)'; } catch(e){}
        }
        var mine = A.viewer().name === p.name && p.id.indexOf('seed-') !== 0;
        return '<article class="post' + (openIds[p.id] ? ' open' : '') + '" data-post="' + esc(p.id) + '">' +
          '<div class="phead">' +
            '<span class="avatar ' + avClass(p.name) + '">' + avGlyph(p.name) + '</span>' +
            '<span class="pwho"><b>' + esc(p.name) + '</b><span class="pmeta">' + when(p.ts) + '</span></span>' +
            (p.notable ? '<span class="pill">&#9733; Notable</span>' : '') +
          '</div>' +
          '<div class="pbody">' +
            (p.title ? '<div class="ptitle">' + esc(p.title) + '</div>' : '') +
            md(p.body) +
            (hasMore ? '<button class="morebtn" type="button">' + moreLabel + '</button>' +
                       '<div class="pmore">' + renderMore(p) + '</div>' : '') +
          '</div>' +
          (p.tags || mine ?
            '<div class="pfoot">' +
              String(p.tags || '').split(/\s+/).filter(Boolean).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
              (mine ? '<button class="delbtn" type="button">delete</button>' : '') +
            '</div>' : '') +
        '</article>';
      }).join('');
      box.innerHTML = tableCard() + (cards || '<div class="chatstate">Nothing on the board yet. Post the first notice.</div>');
      if (stickTop) box.scrollTop = 0;
      markRead();
    }
    function loadBoard(){
      fetch(BASE + '/posts?secret=' + encodeURIComponent(A.secret))
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d || !d.posts) return;
          posts = d.posts;
          postsLoaded = true;
          posts.forEach(function(p){ learnName(p.name); });
          if (posts.length && (!latest[BOARD] || posts[0].ts > latest[BOARD])) latest[BOARD] = posts[0].ts;
          if (cur === BOARD){ renderBoard(); renderHead(); }
          renderRail();
        })
        .catch(function(){});
      Promise.all([
        fetch(BASE + '/events').then(function(r){ return r.json(); }),
        fetch(BASE + '/attendees?secret=' + encodeURIComponent(A.secret)).then(function(r){ return r.json(); })
      ]).then(function(res){
        var events = ((res[0] && res[0].events) || []).filter(function(e){ return e.status === 'upcoming'; })
          .sort(function(a, b){ return a.sort_date < b.sort_date ? -1 : 1; });
        tableInfo = { events: events, attendees: (res[1] && res[1].attendees) || [] };
        if (cur === BOARD) renderBoard();
      }).catch(function(){});
    }
    function sendBoardPost(text){
      var p = {
        id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: A.viewer().name, title: '', body: text, more: '', kind: 'update',
        tags: '', notable: false, ts: new Date().toISOString()
      };
      posts.unshift(p);
      latest[BOARD] = p.ts;
      renderBoard();
      fetch(BASE + '/posts', {
        method: 'POST', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({secret: A.secret, action: 'add', post: p})
      }).then(function(r){
        if (r.ok) A.toast('Pinned to the board.');
        else A.toast('Could not reach the server; it may not have saved.');
      }).catch(function(){ A.toast('Could not reach the server; it may not have saved.'); });
    }

    /* board clicks: drill-in + delete */
    $('msgScroll').addEventListener('click', function(ev){
      if (cur !== BOARD) return;
      var card = ev.target.closest('.post');
      if (!card || !card.getAttribute('data-post')) return;
      var id = card.getAttribute('data-post');
      if (ev.target.closest('.morebtn')){
        openIds[id] = !openIds[id];
        card.classList.toggle('open', !!openIds[id]);
      }
      if (ev.target.closest('.delbtn')){
        if (!window.confirm('Delete this post for everyone?')) return;
        posts = posts.filter(function(p){ return p.id !== id; });
        renderBoard();
        fetch(BASE + '/posts', {
          method: 'POST', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({secret: A.secret, action: 'delete', id: id})
        }).catch(function(){});
      }
    });

    /* ---------- transport: websocket first, polling if it will not stick ---------- */
    var ws = null, wsOk = false, failures = 0, polling = false, lastFrameAt = 0;
    var reconnectTimer = null, pollTimer = null;
    function setLive(state){ /* 'live' | 'reconnecting' | 'polling' */
      var el = $('liveDot');
      el.textContent = state === 'live' ? 'live' : state === 'polling' ? 'shared' : 'reconnecting…';
      el.classList.toggle('on', state !== 'reconnecting');
    }
    function connect(){
      clearTimeout(reconnectTimer);
      var sock;
      try { sock = new WebSocket(WS_URL); } catch(e){ onDown(); return; }
      ws = sock;
      sock.onopen = function(){
        sock.send(JSON.stringify({type: 'hello', secret: A.secret, name: A.viewer().name, channel: cur}));
      };
      sock.onmessage = function(ev){
        lastFrameAt = Date.now();
        var f;
        try { f = JSON.parse(ev.data); } catch(e){ return; }
        handleFrame(f);
      };
      sock.onclose = function(){ if (ws === sock) onDown(); };
      sock.onerror = function(){ /* close fires next */ };
    }
    function onDown(){
      ws = null;
      if (wsOk){ wsOk = false; failures = 0; } else { failures++; }
      if (failures >= 3 && !polling){
        polling = true;
        setLive('polling');
        pollTimer = setInterval(pollTick, 15000);
        pollTick();
      } else if (!polling){
        setLive('reconnecting');
      }
      var wait = Math.min(30000, 1000 * Math.pow(2, Math.min(failures, 5))) * (0.7 + Math.random() * 0.6);
      reconnectTimer = setTimeout(connect, wait);
    }
    function handleFrame(f){
      if (f.type === 'welcome'){
        wsOk = true; failures = 0;
        if (polling){ polling = false; clearInterval(pollTimer); }
        setLive('live');
        channels = f.channels || [];
        who = f.who || [];
        who.forEach(function(w){ learnName(w.name); });
        Object.keys(f.latest || {}).forEach(function(k){
          if (!latest[k] || f.latest[k] > latest[k]) latest[k] = f.latest[k];
        });
        if (cur !== BOARD && !chanById(cur) && channels.length) cur = channels[0].id;
        if (cur !== BOARD) loadHistory(cur, loaded[cur]); /* catch up on whatever we missed while dark */
        renderAll();
        return;
      }
      if (f.type === 'msg'){
        upsertMsg(f.message);
        if (f.message.channel === cur){
          renderMsgs(); renderThread();
          var row = $('msgScroll').querySelector('.mrow[data-id="' + f.message.id + '"]');
          if (row && f.message.name !== A.viewer().name) row.classList.add('new');
        }
        renderRail();
        return;
      }
      if (f.type === 'react'){
        var rs = reacts[f.message] || (reacts[f.message] = []);
        reacts[f.message] = rs.filter(function(r){ return !(r.name === f.name && r.emoji === f.emoji); });
        if (f.on) reacts[f.message].push({name: f.name, emoji: f.emoji});
        if (!f.channel || f.channel === cur){ renderMsgs(); renderThread(); }
        return;
      }
      if (f.type === 'del'){ dropMsg(f.id, f.channel); if (f.channel === cur){ renderMsgs(); renderThread(); } return; }
      if (f.type === 'presence'){ who = f.who || []; who.forEach(function(w){ learnName(w.name); }); renderPresence(); return; }
      if (f.type === 'channels'){
        channels = f.channels || [];
        if (cur !== BOARD && !chanById(cur) && channels.length){ switchChannel(channels[0].id); }
        renderRail(); renderHead();
        return;
      }
      if (f.type === 'err'){ A.toast(f.msg || 'The server said no.'); return; }
    }
    /* the client-side half of the heartbeat: heroku cuts idle sockets at 55s.
       also the self-heal (retry a failed first load) and the board's slow poll. */
    setInterval(function(){
      if (ws && ws.readyState === 1){
        ws.send(JSON.stringify({type: 'ping'}));
        if (lastFrameAt && Date.now() - lastFrameAt > 45000){ ws.close(); }
      }
      if (document.visibilityState !== 'visible') return;
      if (cur !== BOARD && !loaded[cur]) loadHistory(cur);
      loadBoard(); /* system posts land on the board from rsvps; keep its dot honest */
    }, 25000);

    function sendFrame(f){
      if (ws && ws.readyState === 1 && wsOk){ ws.send(JSON.stringify(f)); return true; }
      /* no socket: fall back to the rest mirror */
      var body = null;
      if (f.type === 'msg') body = {action: 'msg', message: {id: f.id, channel: f.channel, parent: f.parent, name: A.viewer().name, body: f.body}};
      if (f.type === 'react') body = {action: 'react', message: f.message, channel: f.channel, name: A.viewer().name, emoji: f.emoji};
      if (f.type === 'del') body = {action: 'delete', id: f.id, channel: f.channel};
      if (!body) return false;
      body.secret = A.secret;
      fetch(BASE + '/chat', {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(body)})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.message){ upsertMsg(d.message); renderMsgs(); renderThread(); }
          else if (d && f.type === 'react'){ pollTick(); }
        })
        .catch(function(){ A.toast('Could not reach the server; it may not have saved.'); });
      return true;
    }

    function loadHistory(chan, sinceLast){
      var url = BASE + '/chat?secret=' + encodeURIComponent(A.secret) + '&channel=' + encodeURIComponent(chan);
      if (sinceLast && latest[chan]){
        /* thirty seconds of overlap; upsert dedupes by id */
        url += '&since=' + encodeURIComponent(new Date(new Date(latest[chan]) - 30000).toISOString());
      }
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d || !d.messages) return;
          channels = d.channels || channels;
          (d.messages || []).forEach(upsertMsg);
          (d.reactions || []).forEach(function(r){
            var rs = reacts[r.message] || (reacts[r.message] = []);
            if (!rs.some(function(x){ return x.name === r.name && x.emoji === r.emoji; })) rs.push({name: r.name, emoji: r.emoji});
          });
          Object.keys(d.latest || {}).forEach(function(k){
            if (!latest[k] || d.latest[k] > latest[k]) latest[k] = d.latest[k];
          });
          loaded[chan] = true;
          renderAll();
        })
        .catch(function(){ if (!polling) setLive('reconnecting'); });
    }
    function pollTick(){
      if (document.visibilityState !== 'visible') return;
      if (cur === BOARD){ loadBoard(); return; }
      loadHistory(cur, loaded[cur]);
    }

    /* ---------- channel switching ---------- */
    function switchChannel(id){
      if (cur === id) return;
      cur = id;
      openThread = null;
      document.body.classList.remove('rail-open');
      if (ws && ws.readyState === 1 && wsOk) ws.send(JSON.stringify({type: 'here', channel: id}));
      if (id === BOARD){ if (!postsLoaded) loadBoard(); }
      else if (!loaded[id]) loadHistory(id);
      renderAll();
      $('chatText').focus();
    }
    $('chanList').addEventListener('click', function(ev){
      var b = ev.target.closest('[data-chan]');
      if (b) switchChannel(b.getAttribute('data-chan'));
    });
    $('boardEntry').addEventListener('click', function(ev){
      var b = ev.target.closest('[data-chan]');
      if (b) switchChannel(BOARD);
    });
    $('railTog').addEventListener('click', function(){ document.body.classList.toggle('rail-open'); });

    /* ---------- sending ---------- */
    function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function sendMessage(ta, parent){
      var text = ta.value.trim();
      if (!text) return;
      ta.value = ''; ta.style.height = 'auto';
      $('mentionPick').hidden = true;
      if (cur === BOARD && !parent){ sendBoardPost(text); return; }
      var m = {
        id: newId(), channel: cur, parent: parent || '', name: A.viewer().name,
        body: text, ts: new Date().toISOString(), pending: true
      };
      upsertMsg(m);
      renderMsgs(); renderThread();
      sendFrame({type: 'msg', id: m.id, channel: m.channel, parent: m.parent, body: m.body});
    }
    function wireComposer(taId, btnId, getParent){
      var ta = $(taId);
      ta.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' && !ev.shiftKey && $('mentionPick').hidden){
          ev.preventDefault();
          sendMessage(ta, getParent());
        }
      });
      ta.addEventListener('input', function(){
        ta.style.height = 'auto';
        ta.style.height = Math.min(150, ta.scrollHeight) + 'px';
      });
      $(btnId).addEventListener('click', function(){ sendMessage(ta, getParent()); });
    }
    wireComposer('chatText', 'chatSend', function(){ return ''; });
    wireComposer('threadText', 'threadSend', function(){ return openThread || ''; });

    /* ---------- @mention picker (main composer) ---------- */
    var mentionSel = 0;
    function mentionQuery(ta){
      var upto = ta.value.slice(0, ta.selectionStart);
      var m = upto.match(/(?:^|\s)@([A-Za-z][\w .'-]{0,30})?$/);
      return m ? (m[1] || '') : null;
    }
    function mentionMatches(q){
      var me = A.viewer().name;
      return Object.keys(knownNames)
        .filter(function(n){ return n !== me && n.toLowerCase().indexOf(q.toLowerCase()) === 0; })
        .sort().slice(0, 6);
    }
    function renderMentionPick(){
      var ta = $('chatText'), box = $('mentionPick');
      var q = mentionQuery(ta);
      var names = q === null ? [] : mentionMatches(q);
      if (!names.length){ box.hidden = true; return; }
      mentionSel = Math.min(mentionSel, names.length - 1);
      box.hidden = false;
      box.innerHTML = names.map(function(n, i){
        return '<button type="button" class="' + (i === mentionSel ? 'sel' : '') + '" data-name="' + esc(n) + '">' +
          '<span class="avatar ' + avClass(n) + '">' + avGlyph(n) + '</span>' + esc(n) + '</button>';
      }).join('');
    }
    function insertMention(name){
      var ta = $('chatText');
      var upto = ta.value.slice(0, ta.selectionStart);
      var rest = ta.value.slice(ta.selectionStart);
      var replaced = upto.replace(/@([A-Za-z][\w .'-]{0,30})?$/, '@' + name + ' ');
      ta.value = replaced + rest;
      ta.selectionStart = ta.selectionEnd = replaced.length;
      $('mentionPick').hidden = true;
      ta.focus();
    }
    $('chatText').addEventListener('input', function(){ mentionSel = 0; renderMentionPick(); });
    $('chatText').addEventListener('keydown', function(ev){
      var box = $('mentionPick');
      if (box.hidden) return;
      var opts = box.querySelectorAll('button');
      if (ev.key === 'ArrowDown'){ ev.preventDefault(); mentionSel = (mentionSel + 1) % opts.length; renderMentionPick(); }
      else if (ev.key === 'ArrowUp'){ ev.preventDefault(); mentionSel = (mentionSel - 1 + opts.length) % opts.length; renderMentionPick(); }
      else if (ev.key === 'Enter' || ev.key === 'Tab'){ ev.preventDefault(); insertMention(opts[mentionSel].getAttribute('data-name')); }
      else if (ev.key === 'Escape'){ box.hidden = true; }
    });
    $('mentionPick').addEventListener('mousedown', function(ev){
      var b = ev.target.closest('[data-name]');
      if (b){ ev.preventDefault(); insertMention(b.getAttribute('data-name')); }
    });
    document.addEventListener('click', function(ev){
      if (!ev.target.closest('#mentionPick, #chatText')) $('mentionPick').hidden = true;
    });

    /* ---------- message actions: react, reply, delete ---------- */
    var picker = null;
    function closePicker(){ if (picker){ picker.remove(); picker = null; } }
    function openPicker(msgId, x, y){
      closePicker();
      picker = document.createElement('div');
      picker.className = 'emojipick';
      picker.innerHTML = EMOJI.map(function(e){
        return '<button type="button" data-e="' + e + '">' + e + '</button>';
      }).join('');
      document.body.appendChild(picker);
      var w = picker.offsetWidth || 260;
      picker.style.left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8) + 'px';
      picker.style.top = Math.max(8, y - 54) + 'px';
      picker.addEventListener('click', function(ev){
        var b = ev.target.closest('[data-e]');
        if (!b) return;
        sendFrame({type: 'react', message: msgId, channel: cur, emoji: b.getAttribute('data-e')});
        closePicker();
      });
    }
    document.addEventListener('click', function(ev){
      if (picker && !ev.target.closest('.emojipick')) closePicker();
    });
    function wireStream(boxId){
      $(boxId).addEventListener('click', function(ev){
        if (cur === BOARD && boxId === 'msgScroll') return; /* board clicks handled above */
        var row = ev.target.closest('.mrow');
        if (!row) return;
        var id = row.getAttribute('data-id');
        var act = ev.target.closest('[data-act]');
        if (act){
          var a = act.getAttribute('data-act');
          if (a === 'react'){ var r = act.getBoundingClientRect(); openPicker(id, r.left, r.top); }
          if (a === 'reply'){ openThread = id; renderThread(); $('threadText').focus(); }
          if (a === 'del'){
            if (!window.confirm('Delete this message for everyone?')) return;
            dropMsg(id, cur); renderMsgs(); renderThread();
            sendFrame({type: 'del', id: id, channel: cur});
          }
          return;
        }
        var chip = ev.target.closest('[data-react]');
        if (chip){ sendFrame({type: 'react', message: id, channel: cur, emoji: chip.getAttribute('data-react')}); return; }
        var th = ev.target.closest('[data-thread]');
        if (th){ openThread = th.getAttribute('data-thread'); renderThread(); $('threadText').focus(); }
      });
    }
    wireStream('msgScroll');
    wireStream('threadScroll');
    $('threadClose').addEventListener('click', function(){ openThread = null; renderThread(); });

    /* the shell pins a note wherever you click a slide; the chat surface is not for pinning */
    $('chatApp').addEventListener('click', function(ev){ ev.stopPropagation(); });
    $('threadPane').addEventListener('click', function(ev){ ev.stopPropagation(); });

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible'){ markRead(); if (polling) pollTick(); }
    });

    /* ---------- boot ---------- */
    loadHistory(cur);
    loadBoard();
    connect();
  }
  boot();
})();
</script>

</div><!-- /deck -->
