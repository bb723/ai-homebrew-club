<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The AI Homebrew Club &middot; The Clubhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="The clubhouse &middot; The AI Homebrew Club">
<meta property="og:description" content="Where members keep talking between meetups. Members only.">
<meta property="og:image" content="https://aihomebrewclub.com/invite-card.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/club.css?v=3">
</head>
<body>

<!-- ===================== GATE ===================== -->
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <span class="logo" data-size="90" aria-hidden="true"></span>
    <h2>Friends only, for now</h2>
    <p>This is the members' clubhouse. Your invite link from the email opens it, or paste the code below.</p>
    <input id="gName" type="text" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <input id="gPass" type="password" placeholder="Secret word" autocomplete="off" aria-label="Secret word">
    <p class="err" id="gErr" role="alert"></p>
    <button id="gGo">Come on in</button>
  </div>
</div>

<!-- ===================== THE SHELL: sidebar (rooms + who's here live in it), the stream, a thread drawer ===================== -->
<div class="shell deck" id="deck">
  <aside class="sidebar" id="sideNav" aria-label="The club"></aside>
  <section class="main">
    <div class="chatapp" id="chatApp">
      <div class="stream">
        <header class="chh">
          <button class="shellbtn" type="button" aria-label="Menu">&#9776;</button>
          <h1 id="chanName"><span class="hash">#</span>general</h1>
          <span class="topic" id="chanTopic"></span>
          <span class="tag tag-plain onl" id="onlCount" hidden></span>
          <button class="btn btn-primary btn-sm postbtn" id="postBtn" type="button" hidden>Post a notice</button>
        </header>
        <div class="msgscroll" id="msgScroll"><div class="chatstate">Pouring the coffee&hellip;</div></div>
        <div class="compwrap">
          <div class="pick" id="mentionPick" hidden></div>
          <div class="comp">
            <textarea id="chatText" maxlength="4000" rows="1" placeholder="Say something to the room&hellip;"></textarea>
            <div class="bar">
              <span class="khint">enter to send &middot; shift+enter for a new line</span>
              <button class="btn btn-primary btn-sm" id="chatSend" type="button">Send</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="thread" id="threadPane" hidden>
        <div class="th">
          <b>Thread</b><span class="mono-s ink3" id="threadChan"></span>
          <button class="x" id="threadClose" type="button" aria-label="Close thread">&#10005;</button>
        </div>
        <div class="tscroll" id="threadScroll"></div>
        <div class="comp">
          <textarea id="threadText" maxlength="4000" rows="1" placeholder="Reply in thread&hellip;"></textarea>
          <div class="bar">
            <span class="khint">enter to send</span>
            <button class="btn btn-secondary btn-sm" id="threadSend" type="button">Reply</button>
          </div>
        </div>
      </aside>
    </div>
  </section>
</div>

<style>
  /* clubhouse-only styles: this block ships only with chat.html and stands on club.css */
  .main{height:100svh; height:100dvh; overflow:hidden}
  .chatapp{flex:1; min-height:0; display:grid; grid-template-columns:1fr; width:100%}
  .chatapp.thread-open{grid-template-columns:1fr 360px}

  /* ---- the sidebar: rooms and who's here (rendered by the page script into #roomsGrp / #hereGrp) ---- */
  .sidebar .room{width:100%; text-align:left; background:none; font-family:var(--font-body); gap:8px}
  .sidebar .room .hash{font-family:var(--font-mono); font-size:13px; color:var(--ink-3); flex:none; width:12px; text-align:center}
  .sidebar .room.here .hash{color:var(--tangerine)}
  .sidebar .room .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sidebar .pr{display:flex; align-items:center; gap:8px; min-height:28px; padding:0 10px; font-size:12.5px; color:var(--ink-2)}
  .sidebar .pr .dot-live{box-shadow:none}
  .sidebar .pr .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sidebar .pr .in{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap}
  .sidebar .railempty{color:var(--ink-3); font-size:12.5px; padding:4px 10px}
  .navi .status .dot-shared{background:var(--lemon)} .navi .status .dot-off{background:var(--ink-3)}

  /* ---- the stream ---- */
  .stream{display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden}
  .chatapp.thread-open .stream{border-right:1px solid var(--rule)}
  .chh{height:56px; flex:none; display:flex; align-items:center; gap:14px; padding:0 24px; border-bottom:1px solid var(--rule); background:var(--paper)}
  .chh h1{font-size:17px; font-family:var(--font-body); font-weight:700; letter-spacing:0; display:flex; align-items:center; gap:4px; white-space:nowrap}
  .chh h1 .hash{font-family:var(--font-mono); color:var(--tangerine); font-weight:600}
  .chh .topic{font-size:13px; color:var(--ink-3); border-left:1px solid var(--rule-2); padding-left:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .chh .topic:empty{display:none}
  .chh .onl{margin-left:auto; flex:none}
  .chh .onl[hidden]{display:none}
  .chh .postbtn{margin-left:auto; flex:none}
  .chh .postbtn[hidden]{display:none}
  .chh .onl:not([hidden]) ~ .postbtn{margin-left:0}

  .msgscroll{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:8px 24px 16px}
  .msgscroll > *{max-width:960px; margin-left:auto; margin-right:auto}
  .chatstate{text-align:center; color:var(--ink-3); font-size:13.5px; padding:30px 0}
  .day{display:flex; align-items:center; gap:14px; padding:14px 0 10px; font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
  .day::before,.day::after{content:""; flex:1; height:1px; background:var(--rule)}

  .m{display:grid; grid-template-columns:34px 1fr; gap:12px; padding:6px 10px; border-radius:8px; position:relative}
  .m:hover{background:rgba(43,36,25,.03)}
  .m.grouped{padding-top:2px; padding-bottom:2px}
  .m.mention-me{background:var(--lemon-wash); box-shadow:inset 3px 0 0 var(--lemon)}
  .m.pending{opacity:.55}
  .m > .av{width:30px; height:30px; margin-top:2px}
  .m .av-sys{background:var(--card); border:1px solid var(--rule-2); color:var(--tangerine); font-size:15px}
  .av-sys{background:var(--card); border:1px solid var(--rule-2); color:var(--tangerine)}
  .m .mcol{min-width:0}
  .m .hd{display:flex; align-items:baseline; gap:8px; margin-bottom:2px}
  .m .hd b{font-size:13.5px}
  .m .hd .t{font-family:var(--font-mono); font-size:11px; color:var(--ink-3)}
  .m .b{font-size:14px; line-height:1.5; color:var(--ink); max-width:70ch; overflow-wrap:break-word}
  .m .b p{margin:0 0 4px} .m .b p:last-child{margin-bottom:0}
  .m .b ul{margin:4px 0 0 18px; padding:0}
  .m .b a{color:var(--teal-deep); text-decoration:underline; text-underline-offset:2px}
  .m .b .at{color:var(--sky-deep); font-weight:600; background:var(--sky-wash); padding:0 3px; border-radius:3px}
  @media (prefers-reduced-motion: no-preference){
    .m.new{animation:arrive .28s ease}
    @keyframes arrive{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
  }
  .rx{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center}
  .rchip{display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 8px; border-radius:12px; border:1px solid var(--rule-2); background:var(--card); font-size:12px; cursor:pointer; color:var(--ink); font-family:var(--font-body)}
  .rchip.on{border-color:var(--teal); background:var(--teal-wash)}
  .tchip{border:0; background:transparent; color:var(--teal-deep); font-weight:600; font-size:12.5px; cursor:pointer; padding:0 4px; font-family:var(--font-body)}
  .tchip:hover{color:var(--tangerine)}
  .mact{position:absolute; right:10px; top:-12px; display:none; gap:2px; background:var(--card); border:1px solid var(--rule-2); border-radius:6px; padding:2px; box-shadow:var(--shadow-1); z-index:3}
  .m:hover .mact{display:inline-flex}
  @media (hover:none){ .mact{display:inline-flex; opacity:.85} }
  .mact button{width:26px; height:24px; display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:4px; background:none; font-size:13px; color:var(--ink-2); cursor:pointer; padding:0}
  .mact button:hover{background:var(--paper-2); color:var(--ink)}

  .emojipick{position:fixed; z-index:120; background:var(--card); border:1px solid var(--rule-2); border-radius:8px; padding:4px 6px; box-shadow:var(--shadow-2); display:flex; gap:2px}
  .emojipick button{border:none; background:none; font-size:1.3rem; cursor:pointer; padding:3px 7px; border-radius:6px}
  .emojipick button:hover{background:var(--paper-2)}

  /* ---- the composer ---- */
  .compwrap{position:relative; flex:none; padding:8px 24px 18px}
  .comp{border:1px solid var(--rule-2); border-radius:10px; background:var(--card); position:relative; max-width:960px; margin:0 auto}
  .comp:focus-within{border-color:var(--teal); box-shadow:0 0 0 3px rgba(85,124,75,.18)}
  .comp textarea{display:block; width:100%; border:0; background:transparent; padding:12px 14px 6px; min-height:56px; max-height:150px; resize:none; outline:none; box-shadow:none; font-size:14px; line-height:1.5; border-radius:10px 10px 0 0}
  .comp textarea:focus{border:0; box-shadow:none}
  .comp .bar{display:flex; align-items:center; gap:8px; padding:6px 10px 8px}
  .comp .bar .khint{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); margin-left:auto}
  .pick{position:absolute; left:24px; bottom:calc(100% - 2px); z-index:110; width:280px; max-width:calc(100% - 48px); background:var(--card); border:1px solid var(--rule-2); border-radius:8px; box-shadow:var(--shadow-2); overflow:hidden}
  .pick[hidden]{display:none}
  .pick button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none; padding:8px 12px; cursor:pointer; font-family:var(--font-body); font-size:13px; color:var(--ink)}
  .pick button.sel,.pick button:hover{background:var(--teal-wash)}

  /* ---- the thread drawer ---- */
  .thread{display:flex; flex-direction:column; min-height:0; overflow:hidden; background:var(--card)}
  .thread[hidden]{display:none}
  .thread .th{height:56px; flex:none; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid var(--rule)}
  .thread .th b{font-size:14px}
  .thread .th .x{margin-left:auto; border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:14px; padding:4px 6px}
  .thread .th .x:hover{color:var(--ink)}
  .thread .tscroll{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:12px 18px; display:flex; flex-direction:column; gap:6px}
  .thread .m{margin:0 -10px}
  .thread .troot{padding-bottom:12px; border-bottom:1px solid var(--rule)}
  .thread .rc{font-family:var(--font-mono); font-size:11px; color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; padding:6px 0 2px}
  .thread .comp{margin:0 14px 14px}

  /* ---- the bulletin board: club news, newest first, the table pinned ---- */
  .msgscroll.is-board{padding:18px 24px}
  .board{display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start; max-width:1100px}
  .board .posts{display:flex; flex-direction:column; gap:12px; min-width:0}
  .post{padding:16px 18px; display:flex; flex-direction:column; gap:8px}
  .post .ph{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .post .ph b{font-size:13.5px}
  .post .ph .t{font-family:var(--font-mono); font-size:11px; color:var(--ink-3)}
  .post h3{font-family:var(--font-body); font-size:16px; letter-spacing:0; line-height:1.3}
  .post .b{font-size:14px; line-height:1.55; color:var(--ink-2); overflow-wrap:break-word}
  .post .b p{margin:0 0 9px} .post .b p:last-child{margin-bottom:0}
  .post .b ul{margin:0 0 9px; padding-left:20px}
  .post .pmore{display:none; border-left:2px solid var(--rule-2); padding-left:14px; margin:6px 0 4px}
  .post.open .pmore{display:block}
  .post .pf{display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap}
  .morebtn{background:none; border:none; padding:0; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--teal-deep); text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(85,124,75,.4)}
  .morebtn:hover{color:var(--tangerine)}
  .delbtn{margin-left:auto; background:none; border:none; padding:0; cursor:pointer; font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--ink-3)}
  .delbtn:hover{color:var(--tangerine)}
  .fmsg{max-width:88%; padding:10px 13px; border-radius:10px; margin:9px 0; border:1px solid var(--rule); font-size:13.5px}
  .fmsg .meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); margin-bottom:4px; letter-spacing:.06em; text-transform:uppercase}
  .fmsg p{margin:0 0 8px} .fmsg p:last-child{margin-bottom:0}
  .fmsg.them{background:var(--sky-wash)}
  .fmsg.me{background:var(--teal-wash); margin-left:auto}
  .table{padding:16px 18px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0}
  .table .ev{display:flex; flex-direction:column; gap:6px; padding:10px 0; border-top:1px dashed var(--rule-2)}
  .table .folio + .ev{border-top:0}
  .table .ev b{font-size:13.5px}
  .table .ev .n{font-size:12.5px; color:var(--ink-2); line-height:1.5}
  .table .ev .n i{color:var(--ink-3)}
  .table .ev .btn{align-self:flex-start; margin-top:2px}

  /* ---- phones: thread becomes an overlay panel, board goes one column ---- */
  @media (max-width:900px){
    .chatapp.thread-open{grid-template-columns:1fr}
    .chatapp.thread-open .stream{border-right:0}
    .thread{position:fixed; top:0; right:0; bottom:0; z-index:66; width:min(420px,100vw); border-left:1px solid var(--rule); box-shadow:-8px 0 30px rgba(0,0,0,.18)}
    .chh{padding:0 12px 0 16px; gap:10px}
    .chh .topic{display:none}
    .msgscroll{padding:8px 12px 12px}
    .msgscroll.is-board{padding:14px 12px}
    .board{grid-template-columns:1fr}
    .table{position:static}
    .compwrap{padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
    .pick{left:12px}
  }
</style>

<script>
(function(){
  'use strict';
  function boot(){
    if (!window.AIHC || !window.AIHC.viewer()){ setTimeout(boot, 300); return; }
    var A = window.AIHC;
    function isAdmin(){ return A.role && A.role() === 'admin'; }
    var BASE = String(A.sync || '').replace(/\/notes\b.*$/, '');
    if (!/^https?:/.test(BASE)) return; /* no backend configured: leave the loading note */
    var WS_URL = BASE.replace(/^http/, 'ws') + '/chat/ws';
    var LS_READ = 'aihc_chat_read_v1';
    var EMOJI = ['\ud83d\udc4d','\u2764\ufe0f','\ud83d\ude02','\ud83c\udf89','\ud83c\udf7a','\ud83e\udd2f'];
    var BOARD = '~feed'; /* pseudo-room for the club feed; slugs can never collide with it */

    function $(id){ return document.getElementById(id); }
    function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

    /* ---------- state ---------- */
    var channels = [];            /* open channels from the server, sidebar order */
    var msgs = {};                /* channel id -> sorted message array */
    var loaded = {};              /* channel id -> history fetched */
    var reacts = {};              /* message id -> [{name, emoji}] */
    var latest = {};              /* channel id -> newest ts, for unread dots */
    var who = [];                 /* presence: [{name, channel}] */
    var cur = 'general';
    /* deep links: chat.html?room=~feed lands on the bulletin board (feed.html redirects here) */
    try {
      if (new URLSearchParams(location.search).get('room') === BOARD && isAdmin()) cur = BOARD;
    } catch(e){}
    var openThread = null;        /* parent message id, or null */
    var read = {};
    try { read = JSON.parse(localStorage.getItem(LS_READ) || '{}'); } catch(e){ read = {}; }
    /* the board */
    var posts = [];
    var postsLoaded = false;
    var tableInfo = null;         /* {events, attendees} for the who's-coming card */
    var openIds = {};             /* drilled-open feed posts, survives re-render */

    /* ---------- tiny renderers borrowed from the feed ---------- */
    function md(t){
      var out = [], list = null;
      String(t).split('\n').forEach(function(raw){
        var ln = esc(raw)
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/(https?:\/\/[^\s<]+)/g, function(u){
            return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\//, '') + '</a>';
          });
        if (/^- /.test(raw)){
          if (!list){ list = []; out.push(list); }
          list.push(ln.replace(/^- /, ''));
        } else {
          list = null;
          if (raw.trim()) out.push('<p>' + ln + '</p>');
        }
      });
      return out.map(function(x){
        return Array.isArray(x) ? '<ul><li>' + x.join('</li><li>') + '</li></ul>' : x;
      }).join('');
    }
    function avClass(name){
      var n = String(name).toLowerCase();
      if (n === 'the club') return 'av-sys';
      var h = 0;
      for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
      return ['av-teal', 'av-sky', 'av-berry', 'av-lemon'][h % 4];
    }
    function avGlyph(name){
      return String(name).toLowerCase() === 'the club' ? '\u2615' : esc(String(name).trim().charAt(0).toUpperCase());
    }
    function tOnly(ts){
      var d = new Date(ts);
      return isNaN(d) ? '' : d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase();
    }
    function dayOf(ts){
      var d = new Date(ts);
      return isNaN(d) ? '' : d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
    }
    function when(ts){
      var d = new Date(ts);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) + ' \u00b7 ' +
        d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase();
    }

    /* ---------- mentions: names we know = authors + everyone here now ---------- */
    var knownNames = {};
    function learnName(n){ if (n && n !== 'The club') knownNames[String(n)] = true; }
    learnName(A.viewer().name);
    function mentionize(html){
      var names = Object.keys(knownNames).sort(function(a, b){ return b.length - a.length; });
      if (!names.length) return html;
      var alt = names.map(function(n){ return esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
      var re = new RegExp('@(' + alt + ')', 'gi');
      return html.replace(re, function(m, n){ return '<span class="at">@' + n + '</span>'; });
    }
    function mentionsMe(body){
      return String(body).toLowerCase().indexOf('@' + String(A.viewer().name).toLowerCase()) !== -1;
    }

    /* ---------- message store ---------- */
    function upsertMsg(m){
      learnName(m.name);
      var list = msgs[m.channel] || (msgs[m.channel] = []);
      for (var i = 0; i < list.length; i++){
        if (list[i].id === m.id){ list[i] = m; return; }
      }
      list.push(m);
      list.sort(function(a, b){ return a.ts < b.ts ? -1 : 1; });
      if (!latest[m.channel] || m.ts > latest[m.channel]) latest[m.channel] = m.ts;
    }
    function dropMsg(id, channel){
      if (msgs[channel]) msgs[channel] = msgs[channel].filter(function(m){ return m.id !== id && m.parent !== id; });
      delete reacts[id];
    }
    function replyCount(id, channel){
      return (msgs[channel] || []).filter(function(m){ return m.parent === id; }).length;
    }
    function markRead(){
      if (document.visibilityState !== 'visible') return;
      if (latest[cur] && (!read[cur] || latest[cur] > read[cur])){
        read[cur] = latest[cur];
        try { localStorage.setItem(LS_READ, JSON.stringify(read)); } catch(e){}
        renderRail();
      }
    }

    /* ---------- rendering ---------- */
    function chanById(id){
      for (var i = 0; i < channels.length; i++) if (channels[i].id === id) return channels[i];
      return null;
    }
    function hasUnread(id){
      return latest[id] && (!read[id] || latest[id] > read[id]) && id !== cur;
    }
    /* the rooms live in the shared sidebar: club.js paints the shell (an empty "Rooms" group
       and an empty "Here now" group come from AIHC_PAGE.sideExtras) and calls PAGE.onSideNav
       after every repaint; these two renderers fill the groups it owns. */
    function roomsBox(){ return $('roomsGrp'); }
    function hereBox(){ return $('hereGrp'); }
    function roomRow(id, hash, name, unread){
      return '<button class="navi room' + (cur === id ? ' here' : '') + '" type="button" data-chan="' + esc(id) + '">' +
        '<span class="hash">' + hash + '</span><span class="nm">' + esc(name) + '</span>' +
        (unread ? '<span class="unread"></span>' : '') +
      '</button>';
    }
    function renderRail(){
      var box = roomsBox();
      if (!box) return;
      var out = ['<span class="h">Rooms</span>'];
      if (!channels.length) out.push('<div class="railempty">' + (wsOk || Object.keys(loaded).length ? 'No rooms yet.' : 'Setting the table&hellip;') + '</div>');
      channels.forEach(function(c){ out.push(roomRow(c.id, '#', c.name, hasUnread(c.id))); });
      /* the board is internal: only the folks running the place see it */
      if (isAdmin()) out.push(roomRow(BOARD, '&#9734;', 'The bulletin board', hasUnread(BOARD)));
      box.innerHTML = out.join('');
    }
    function renderPresence(){
      var seen = {}, rows = [];
      who.forEach(function(w){
        if (seen[w.name]) return;
        seen[w.name] = true;
        var c = chanById(w.channel);
        var where = w.channel === BOARD ? 'the board' : (c ? '#' + c.name : '');
        rows.push('<span class="pr"><span class="dot dot-live"></span>' +
          '<span class="nm">' + esc(w.name) + '</span>' +
          (where ? '<span class="in">' + esc(where) + '</span>' : '') +
        '</span>');
      });
      var box = hereBox();
      if (box){
        box.innerHTML = '<span class="h">Here now' + (rows.length ? ' &middot; ' + rows.length : '') + '</span>' +
          (rows.length ? rows.join('') : '<div class="railempty">Just you, so far.</div>');
      }
      var inRoom = who.filter(function(w){ return w.channel === cur; }).length;
      $('onlCount').hidden = !inRoom;
      $('onlCount').textContent = inRoom + ' here';
    }
    function reactChips(id){
      var rs = reacts[id] || [];
      if (!rs.length) return '';
      var byEmoji = {};
      rs.forEach(function(r){ (byEmoji[r.emoji] || (byEmoji[r.emoji] = [])).push(r.name); });
      var me = A.viewer().name;
      return Object.keys(byEmoji).map(function(e){
        var names = byEmoji[e];
        var mine = names.indexOf(me) !== -1;
        return '<button class="rchip' + (mine ? ' on' : '') + '" type="button" data-react="' + esc(e) + '" ' +
          'title="' + esc(names.join(', ')) + '">' + esc(e) + ' ' + names.length + '</button>';
      }).join('');
    }
    function msgRow(m, prev, inThread){
      var grouped = prev && prev.name === m.name && prev.parent === m.parent &&
        (new Date(m.ts) - new Date(prev.ts)) < 5 * 60000;
      var mine = m.name === A.viewer().name;
      var replies = !inThread && !m.parent ? replyCount(m.id, m.channel) : 0;
      var body = mentionize(md(m.body));
      return '<div class="m' + (grouped ? ' grouped' : '') +
          (m.pending ? ' pending' : '') +
          (!mine && mentionsMe(m.body) ? ' mention-me' : '') + '" data-id="' + esc(m.id) + '">' +
        (grouped ? '<span></span>'
                 : '<span class="av ' + avClass(m.name) + '">' + avGlyph(m.name) + '</span>') +
        '<div class="mcol">' +
          (grouped ? '' : '<div class="hd"><b>' + esc(m.name) + '</b><span class="t">' + tOnly(m.ts) + '</span></div>') +
          '<div class="b">' + body + '</div>' +
          (reactChips(m.id) || replies ?
            '<div class="rx">' + reactChips(m.id) +
              (replies ? '<button class="tchip" type="button" data-thread="' + esc(m.id) + '">' +
                replies + (replies === 1 ? ' reply' : ' replies') + ' &rarr;</button>' : '') +
            '</div>' : '') +
        '</div>' +
        '<div class="mact">' +
          '<button type="button" data-act="react" title="React">&#9786;</button>' +
          (!inThread && !m.parent ? '<button type="button" data-act="reply" title="Reply in thread">&#8617;</button>' : '') +
          (mine && !m.pending ? '<button type="button" data-act="del" title="Delete">&#10005;</button>' : '') +
        '</div>' +
      '</div>';
    }
    function renderMsgs(){
      if (cur === BOARD){ renderBoard(); return; }
      var box = $('msgScroll');
      box.classList.remove('is-board');
      var stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      var list = (msgs[cur] || []).filter(function(m){ return !m.parent; });
      if (!list.length){
        box.innerHTML = '<div class="chatstate">' +
          (loaded[cur] ? 'Nothing said in here yet. Break the ice.' : 'Pouring the coffee&hellip;') + '</div>';
        return;
      }
      var out = [], prev = null, prevDay = '';
      list.forEach(function(m){
        var d = dayOf(m.ts);
        if (d !== prevDay){ out.push('<div class="day">' + esc(d) + '</div>'); prevDay = d; prev = null; }
        out.push(msgRow(m, prev, false));
        prev = m;
      });
      box.innerHTML = out.join('');
      if (stick) box.scrollTop = box.scrollHeight;
      markRead();
    }
    function renderThread(){
      var pane = $('threadPane'), app = $('chatApp');
      if (!openThread){ pane.hidden = true; app.classList.remove('thread-open'); return; }
      var all = msgs[cur] || [];
      var root = null;
      all.forEach(function(m){ if (m.id === openThread) root = m; });
      if (!root){ openThread = null; pane.hidden = true; app.classList.remove('thread-open'); return; }
      pane.hidden = false; app.classList.add('thread-open');
      var c = chanById(cur);
      $('threadChan').textContent = c ? '#' + c.name : '';
      var out = ['<div class="troot">' + msgRow(root, null, true) + '</div>'];
      var replies = all.filter(function(m){ return m.parent === openThread; });
      if (replies.length) out.push('<span class="rc">' + replies.length + (replies.length === 1 ? ' reply' : ' replies') + '</span>');
      var prev = null;
      replies.forEach(function(m){
        out.push(msgRow(m, prev, true));
        prev = m;
      });
      var box = $('threadScroll');
      var stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      box.innerHTML = out.join('');
      if (stick) box.scrollTop = box.scrollHeight;
    }
    function renderHead(){
      if (cur === BOARD){
        $('chanName').innerHTML = '<span class="hash">&#9734;</span> The bulletin board';
        $('chanTopic').textContent = 'What happened, and who said yes.';
        $('chatText').placeholder = 'Post it to the club\u2026';
        $('postBtn').hidden = false;
        return;
      }
      var c = chanById(cur);
      $('chanName').innerHTML = '<span class="hash">#</span>' + esc(c ? c.name : cur);
      $('chanTopic').textContent = c ? c.topic : '';
      $('chatText').placeholder = 'Say something to #' + (c ? c.name : cur) + '\u2026';
      $('postBtn').hidden = true;
    }
    function renderAll(){ renderRail(); renderPresence(); renderHead(); renderMsgs(); renderThread(); }

    /* ---------- the bulletin board: feed posts as cards ---------- */
    function renderMore(p){
      if (p.kind === 'thread'){
        var data = null;
        try { data = JSON.parse(p.more); } catch(e){}
        if (!data || !data.messages) return '';
        return data.messages.map(function(m){
          return '<div class="fmsg ' + (m.side === 'me' ? 'me' : 'them') + '">' +
            '<div class="meta">' + esc(m.meta) + '</div>' + md(m.text) + '</div>';
        }).join('');
      }
      return md(p.more);
    }
    /* the seat meter: one square per chair at the table */
    function seatMeter(e){
      var cap = parseInt(e.capacity, 10) || 0;
      var left = Math.max(0, parseInt(e.left, 10) || 0);
      var taken = Math.max(0, cap - left);
      var full = cap > 0 && left <= 0;
      var sq = '';
      for (var i = 0; i < Math.min(cap, 40); i++) sq += '<span class="s' + (i < taken ? '' : ' open') + '"></span>';
      var n = full ? 'full' : (cap > 0 ? left + ' open' : '');
      return '<span class="seats' + (full ? ' full' : '') + '">' +
        (sq ? '<span class="row">' + sq + '</span>' : '') +
        (n ? '<span class="n">' + n + '</span>' : '') + '</span>';
    }
    function tableCard(){
      if (!tableInfo) return '';
      var events = tableInfo.events, att = tableInfo.attendees;
      if (!events.length) return '';
      var inner = events.map(function(e){
        var mine = att.filter(function(a){ return a.event === e.id; });
        var seats = mine.filter(function(a){ return a.status === 'seat'; });
        var waits = mine.filter(function(a){ return a.status === 'waitlist'; });
        function names(list){
          return list.map(function(a){ return esc(a.name) + (a.biz ? ' (' + esc(a.biz) + ')' : ''); }).join(', ');
        }
        var href = 'rsvp.html?event=' + encodeURIComponent(e.id);
        return '<div class="ev">' +
          '<b>' + esc(e.when) + ' \u00b7 ' + esc(e.location) + '</b>' +
          seatMeter(e) +
          (seats.length
            ? '<span class="n"><i>At the table (' + seats.length + ' of ' + e.capacity + '):</i> ' + names(seats) + '</span>'
            : '<span class="n">No seats claimed yet. Be the first.</span>') +
          (waits.length ? '<span class="n"><i>Waiting for a seat:</i> ' + names(waits) + '</span>' : '') +
          (e.left > 0
            ? '<a class="btn btn-secondary btn-sm" href="' + href + '">' + e.left + ' seat' + (e.left === 1 ? '' : 's') + ' open \u00b7 save one</a>'
            : '<a class="btn btn-secondary btn-sm" href="' + href + '">Full \u00b7 join the waitlist</a>') +
        '</div>';
      }).join('');
      return '<div class="card table"><span class="folio"><b>The table</b> \u00b7 who&rsquo;s coming</span>' + inner + '</div>';
    }
    function renderBoard(){
      var box = $('msgScroll');
      box.classList.add('is-board');
      var stickTop = box.scrollTop < 60; /* the board reads newest-first from the top */
      if (!postsLoaded){
        box.innerHTML = '<div class="chatstate">Unpinning the notices&hellip;</div>';
        return;
      }
      var cards = posts.map(function(p){
        var hasMore = p.more && String(p.more).trim();
        var moreLabel = p.kind === 'thread' ? 'Read the thread' : 'Show more';
        if (p.kind === 'thread'){
          try { moreLabel += ' (' + JSON.parse(p.more).messages.length + ' messages)'; } catch(e){}
        }
        var mine = A.viewer().name === p.name && p.id.indexOf('seed-') !== 0;
        var tags = String(p.tags || '').split(/\s+/).filter(Boolean);
        return '<article class="card post' + (openIds[p.id] ? ' open' : '') + '" data-post="' + esc(p.id) + '">' +
          '<div class="ph">' +
            '<span class="av av-sm ' + avClass(p.name) + '">' + avGlyph(p.name) + '</span>' +
            '<b>' + esc(p.name) + '</b><span class="t">' + when(p.ts) + '</span>' +
            (p.notable ? '<span class="tag tag-lemon">&#9733; Notable</span>' : '') +
          '</div>' +
          (p.title ? '<h3>' + esc(p.title) + '</h3>' : '') +
          '<div class="b">' + md(p.body) +
            (hasMore ? '<div class="pmore">' + renderMore(p) + '</div>' : '') +
          '</div>' +
          (hasMore || tags.length || mine ?
            '<div class="pf">' +
              (hasMore ? '<button class="morebtn" type="button">' + moreLabel + '</button>' : '') +
              tags.map(function(t){ return '<span class="tag tag-plain">' + esc(t) + '</span>'; }).join('') +
              (mine ? '<button class="delbtn" type="button">delete</button>' : '') +
            '</div>' : '') +
        '</article>';
      }).join('');
      box.innerHTML = '<div class="board"><div class="posts">' +
        (cards || '<div class="chatstate">Nothing on the board yet. Post the first notice.</div>') +
        '</div>' + tableCard() + '</div>';
      if (stickTop) box.scrollTop = 0;
      markRead();
    }
    function loadBoard(){
      if (!isAdmin()) return;
      fetch(BASE + '/posts?secret=' + encodeURIComponent(A.secret))
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d || !d.posts) return;
          posts = d.posts;
          postsLoaded = true;
          posts.forEach(function(p){ learnName(p.name); });
          if (posts.length && (!latest[BOARD] || posts[0].ts > latest[BOARD])) latest[BOARD] = posts[0].ts;
          if (cur === BOARD){ renderBoard(); renderHead(); }
          renderRail();
        })
        .catch(function(){});
      Promise.all([
        fetch(BASE + '/events').then(function(r){ return r.json(); }),
        fetch(BASE + '/attendees?secret=' + encodeURIComponent(A.secret)).then(function(r){ return r.json(); })
      ]).then(function(res){
        var events = ((res[0] && res[0].events) || []).filter(function(e){ return e.status === 'upcoming'; })
          .sort(function(a, b){ return a.sort_date < b.sort_date ? -1 : 1; });
        tableInfo = { events: events, attendees: (res[1] && res[1].attendees) || [] };
        if (cur === BOARD) renderBoard();
      }).catch(function(){});
    }
    function sendBoardPost(text){
      var p = {
        id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: A.viewer().name, title: '', body: text, more: '', kind: 'update',
        tags: '', notable: false, ts: new Date().toISOString()
      };
      posts.unshift(p);
      latest[BOARD] = p.ts;
      renderBoard();
      fetch(BASE + '/posts', {
        method: 'POST', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({secret: A.secret, action: 'add', post: p})
      }).then(function(r){
        if (r.ok) A.toast('Pinned to the board.');
        else A.toast('Could not reach the server; it may not have saved.');
      }).catch(function(){ A.toast('Could not reach the server; it may not have saved.'); });
    }

    /* board clicks: drill-in + delete */
    $('msgScroll').addEventListener('click', function(ev){
      if (cur !== BOARD) return;
      var card = ev.target.closest('.post');
      if (!card || !card.getAttribute('data-post')) return;
      var id = card.getAttribute('data-post');
      if (ev.target.closest('.morebtn')){
        openIds[id] = !openIds[id];
        card.classList.toggle('open', !!openIds[id]);
      }
      if (ev.target.closest('.delbtn')){
        if (!window.confirm('Delete this post for everyone?')) return;
        posts = posts.filter(function(p){ return p.id !== id; });
        renderBoard();
        fetch(BASE + '/posts', {
          method: 'POST', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({secret: A.secret, action: 'delete', id: id})
        }).catch(function(){});
      }
    });

    /* ---------- transport: websocket first, polling if it will not stick ---------- */
    var ws = null, wsOk = false, failures = 0, polling = false, lastFrameAt = 0;
    var reconnectTimer = null, pollTimer = null;
    var liveState = 'connecting';
    function paintLive(){
      var nav = document.querySelector('#sideNav [data-nav="chat"]');
      if (!nav) return;
      var el = nav.querySelector('.status');
      if (!el){ el = document.createElement('span'); el.className = 'status'; el.id = 'liveDot'; nav.appendChild(el); }
      var dot = liveState === 'live' ? 'dot-live' : liveState === 'polling' ? 'dot-shared' : 'dot-off';
      var label = liveState === 'live' ? 'live' : liveState === 'polling' ? 'shared' : liveState === 'connecting' ? 'connecting' : 'reconnecting\u2026';
      el.innerHTML = '<span class="dot ' + dot + '"></span> ' + label;
    }
    function setLive(state){ /* 'live' | 'reconnecting' | 'polling' */
      liveState = state;
      paintLive();
    }
    function connect(){
      clearTimeout(reconnectTimer);
      var sock;
      try { sock = new WebSocket(WS_URL); } catch(e){ onDown(); return; }
      ws = sock;
      sock.onopen = function(){
        sock.send(JSON.stringify({type: 'hello', secret: A.secret, name: A.viewer().name, channel: cur}));
      };
      sock.onmessage = function(ev){
        lastFrameAt = Date.now();
        var f;
        try { f = JSON.parse(ev.data); } catch(e){ return; }
        handleFrame(f);
      };
      sock.onclose = function(){ if (ws === sock) onDown(); };
      sock.onerror = function(){ /* close fires next */ };
    }
    function onDown(){
      ws = null;
      if (wsOk){ wsOk = false; failures = 0; } else { failures++; }
      if (failures >= 3 && !polling){
        polling = true;
        setLive('polling');
        pollTimer = setInterval(pollTick, 15000);
        pollTick();
      } else if (!polling){
        setLive('reconnecting');
      }
      var wait = Math.min(30000, 1000 * Math.pow(2, Math.min(failures, 5))) * (0.7 + Math.random() * 0.6);
      reconnectTimer = setTimeout(connect, wait);
    }
    function handleFrame(f){
      if (f.type === 'welcome'){
        wsOk = true; failures = 0;
        if (polling){ polling = false; clearInterval(pollTimer); }
        setLive('live');
        channels = f.channels || [];
        who = f.who || [];
        who.forEach(function(w){ learnName(w.name); });
        Object.keys(f.latest || {}).forEach(function(k){
          if (!latest[k] || f.latest[k] > latest[k]) latest[k] = f.latest[k];
        });
        if (cur !== BOARD && !chanById(cur) && channels.length) cur = channels[0].id;
        if (cur !== BOARD) loadHistory(cur, loaded[cur]); /* catch up on whatever we missed while dark */
        renderAll();
        return;
      }
      if (f.type === 'msg'){
        upsertMsg(f.message);
        if (f.message.channel === cur){
          renderMsgs(); renderThread();
          var row = $('msgScroll').querySelector('.m[data-id="' + f.message.id + '"]');
          if (row && f.message.name !== A.viewer().name) row.classList.add('new');
        }
        renderRail();
        return;
      }
      if (f.type === 'react'){
        var rs = reacts[f.message] || (reacts[f.message] = []);
        reacts[f.message] = rs.filter(function(r){ return !(r.name === f.name && r.emoji === f.emoji); });
        if (f.on) reacts[f.message].push({name: f.name, emoji: f.emoji});
        if (!f.channel || f.channel === cur){ renderMsgs(); renderThread(); }
        return;
      }
      if (f.type === 'del'){ dropMsg(f.id, f.channel); if (f.channel === cur){ renderMsgs(); renderThread(); } return; }
      if (f.type === 'presence'){ who = f.who || []; who.forEach(function(w){ learnName(w.name); }); renderPresence(); return; }
      if (f.type === 'channels'){
        channels = f.channels || [];
        if (cur !== BOARD && !chanById(cur) && channels.length){ switchChannel(channels[0].id); }
        renderRail(); renderHead();
        return;
      }
      if (f.type === 'err'){ A.toast(f.msg || 'The server said no.'); return; }
    }
    /* the client-side half of the heartbeat: heroku cuts idle sockets at 55s.
       also the self-heal (retry a failed first load) and the board's slow poll. */
    setInterval(function(){
      if (ws && ws.readyState === 1){
        ws.send(JSON.stringify({type: 'ping'}));
        if (lastFrameAt && Date.now() - lastFrameAt > 45000){ ws.close(); }
      }
      if (document.visibilityState !== 'visible') return;
      if (cur !== BOARD && !loaded[cur]) loadHistory(cur);
      loadBoard(); /* system posts land on the board from rsvps; keep its dot honest */
    }, 25000);

    function sendFrame(f){
      if (ws && ws.readyState === 1 && wsOk){ ws.send(JSON.stringify(f)); return true; }
      /* no socket: fall back to the rest mirror */
      var body = null;
      if (f.type === 'msg') body = {action: 'msg', message: {id: f.id, channel: f.channel, parent: f.parent, name: A.viewer().name, body: f.body}};
      if (f.type === 'react') body = {action: 'react', message: f.message, channel: f.channel, name: A.viewer().name, emoji: f.emoji};
      if (f.type === 'del') body = {action: 'delete', id: f.id, channel: f.channel};
      if (!body) return false;
      body.secret = A.secret;
      fetch(BASE + '/chat', {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(body)})
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.message){ upsertMsg(d.message); renderMsgs(); renderThread(); }
          else if (d && f.type === 'react'){ pollTick(); }
        })
        .catch(function(){ A.toast('Could not reach the server; it may not have saved.'); });
      return true;
    }

    function loadHistory(chan, sinceLast){
      var url = BASE + '/chat?secret=' + encodeURIComponent(A.secret) + '&channel=' + encodeURIComponent(chan);
      if (sinceLast && latest[chan]){
        /* thirty seconds of overlap; upsert dedupes by id */
        url += '&since=' + encodeURIComponent(new Date(new Date(latest[chan]) - 30000).toISOString());
      }
      fetch(url)
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d || !d.messages) return;
          channels = d.channels || channels;
          (d.messages || []).forEach(upsertMsg);
          (d.reactions || []).forEach(function(r){
            var rs = reacts[r.message] || (reacts[r.message] = []);
            if (!rs.some(function(x){ return x.name === r.name && x.emoji === r.emoji; })) rs.push({name: r.name, emoji: r.emoji});
          });
          Object.keys(d.latest || {}).forEach(function(k){
            if (!latest[k] || d.latest[k] > latest[k]) latest[k] = d.latest[k];
          });
          loaded[chan] = true;
          renderAll();
        })
        .catch(function(){ if (!polling) setLive('reconnecting'); });
    }
    function pollTick(){
      if (document.visibilityState !== 'visible') return;
      if (cur === BOARD){ loadBoard(); return; }
      loadHistory(cur, loaded[cur]);
    }

    /* ---------- channel switching ---------- */
    function switchChannel(id){
      if (cur === id) return;
      cur = id;
      openThread = null;
      document.body.classList.remove('deck-open');
      if (ws && ws.readyState === 1 && wsOk) ws.send(JSON.stringify({type: 'here', channel: id}));
      if (id === BOARD){ if (!postsLoaded) loadBoard(); }
      else if (!loaded[id]) loadHistory(id);
      renderAll();
      $('chatText').focus();
    }
    /* the sidebar is repainted wholesale by club.js, so room clicks are delegated from its root */
    $('sideNav').addEventListener('click', function(ev){
      var b = ev.target.closest('[data-chan]');
      if (b) switchChannel(b.getAttribute('data-chan'));
    });
    $('postBtn').addEventListener('click', function(){ $('chatText').focus(); });
    /* club.js repaints the sidebar on every session change; put the rooms, who's here and the live dot back */
    window.AIHC_PAGE.onSideNav = function(){ renderRail(); renderPresence(); paintLive(); };
    window.AIHC_PAGE.onSideNav();

    /* ---------- sending ---------- */
    function newId(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function sendMessage(ta, parent){
      var text = ta.value.trim();
      if (!text) return;
      ta.value = ''; ta.style.height = 'auto';
      $('mentionPick').hidden = true;
      if (cur === BOARD && !parent){ sendBoardPost(text); return; }
      var m = {
        id: newId(), channel: cur, parent: parent || '', name: A.viewer().name,
        body: text, ts: new Date().toISOString(), pending: true
      };
      upsertMsg(m);
      renderMsgs(); renderThread();
      sendFrame({type: 'msg', id: m.id, channel: m.channel, parent: m.parent, body: m.body});
    }
    function wireComposer(taId, btnId, getParent){
      var ta = $(taId);
      ta.addEventListener('keydown', function(ev){
        if (ev.key === 'Enter' && !ev.shiftKey && $('mentionPick').hidden){
          ev.preventDefault();
          sendMessage(ta, getParent());
        }
      });
      ta.addEventListener('input', function(){
        ta.style.height = 'auto';
        ta.style.height = Math.min(150, ta.scrollHeight) + 'px';
      });
      $(btnId).addEventListener('click', function(){ sendMessage(ta, getParent()); });
    }
    wireComposer('chatText', 'chatSend', function(){ return ''; });
    wireComposer('threadText', 'threadSend', function(){ return openThread || ''; });

    /* ---------- @mention picker (main composer) ---------- */
    var mentionSel = 0;
    function mentionQuery(ta){
      var upto = ta.value.slice(0, ta.selectionStart);
      var m = upto.match(/(?:^|\s)@([A-Za-z][\w .'-]{0,30})?$/);
      return m ? (m[1] || '') : null;
    }
    function mentionMatches(q){
      var me = A.viewer().name;
      return Object.keys(knownNames)
        .filter(function(n){ return n !== me && n.toLowerCase().indexOf(q.toLowerCase()) === 0; })
        .sort().slice(0, 6);
    }
    function renderMentionPick(){
      var ta = $('chatText'), box = $('mentionPick');
      var q = mentionQuery(ta);
      var names = q === null ? [] : mentionMatches(q);
      if (!names.length){ box.hidden = true; return; }
      mentionSel = Math.min(mentionSel, names.length - 1);
      box.hidden = false;
      box.innerHTML = names.map(function(n, i){
        return '<button type="button" class="' + (i === mentionSel ? 'sel' : '') + '" data-name="' + esc(n) + '">' +
          '<span class="av av-sm ' + avClass(n) + '">' + avGlyph(n) + '</span>' + esc(n) + '</button>';
      }).join('');
    }
    function insertMention(name){
      var ta = $('chatText');
      var upto = ta.value.slice(0, ta.selectionStart);
      var rest = ta.value.slice(ta.selectionStart);
      var replaced = upto.replace(/@([A-Za-z][\w .'-]{0,30})?$/, '@' + name + ' ');
      ta.value = replaced + rest;
      ta.selectionStart = ta.selectionEnd = replaced.length;
      $('mentionPick').hidden = true;
      ta.focus();
    }
    $('chatText').addEventListener('input', function(){ mentionSel = 0; renderMentionPick(); });
    $('chatText').addEventListener('keydown', function(ev){
      var box = $('mentionPick');
      if (box.hidden) return;
      var opts = box.querySelectorAll('button');
      if (ev.key === 'ArrowDown'){ ev.preventDefault(); mentionSel = (mentionSel + 1) % opts.length; renderMentionPick(); }
      else if (ev.key === 'ArrowUp'){ ev.preventDefault(); mentionSel = (mentionSel - 1 + opts.length) % opts.length; renderMentionPick(); }
      else if (ev.key === 'Enter' || ev.key === 'Tab'){ ev.preventDefault(); insertMention(opts[mentionSel].getAttribute('data-name')); }
      else if (ev.key === 'Escape'){ box.hidden = true; }
    });
    $('mentionPick').addEventListener('mousedown', function(ev){
      var b = ev.target.closest('[data-name]');
      if (b){ ev.preventDefault(); insertMention(b.getAttribute('data-name')); }
    });
    document.addEventListener('click', function(ev){
      if (!ev.target.closest('#mentionPick, #chatText')) $('mentionPick').hidden = true;
    });

    /* ---------- message actions: react, reply, delete ---------- */
    var picker = null;
    function closePicker(){ if (picker){ picker.remove(); picker = null; } }
    function openPicker(msgId, x, y){
      closePicker();
      picker = document.createElement('div');
      picker.className = 'emojipick';
      picker.innerHTML = EMOJI.map(function(e){
        return '<button type="button" data-e="' + e + '">' + e + '</button>';
      }).join('');
      document.body.appendChild(picker);
      var w = picker.offsetWidth || 260;
      picker.style.left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8) + 'px';
      picker.style.top = Math.max(8, y - 54) + 'px';
      picker.addEventListener('click', function(ev){
        var b = ev.target.closest('[data-e]');
        if (!b) return;
        sendFrame({type: 'react', message: msgId, channel: cur, emoji: b.getAttribute('data-e')});
        closePicker();
      });
    }
    document.addEventListener('click', function(ev){
      if (picker && !ev.target.closest('.emojipick')) closePicker();
    });
    function wireStream(boxId){
      $(boxId).addEventListener('click', function(ev){
        if (cur === BOARD && boxId === 'msgScroll') return; /* board clicks handled above */
        var row = ev.target.closest('.m');
        if (!row) return;
        var id = row.getAttribute('data-id');
        var act = ev.target.closest('[data-act]');
        if (act){
          var a = act.getAttribute('data-act');
          if (a === 'react'){ ev.stopPropagation(); var r = act.getBoundingClientRect(); openPicker(id, r.left, r.top); }
          if (a === 'reply'){ openThread = id; renderThread(); $('threadText').focus(); }
          if (a === 'del'){
            if (!window.confirm('Delete this message for everyone?')) return;
            dropMsg(id, cur); renderMsgs(); renderThread();
            sendFrame({type: 'del', id: id, channel: cur});
          }
          return;
        }
        var chip = ev.target.closest('[data-react]');
        if (chip){ sendFrame({type: 'react', message: id, channel: cur, emoji: chip.getAttribute('data-react')}); return; }
        var th = ev.target.closest('[data-thread]');
        if (th){ openThread = th.getAttribute('data-thread'); renderThread(); $('threadText').focus(); }
      });
    }
    wireStream('msgScroll');
    wireStream('threadScroll');
    $('threadClose').addEventListener('click', function(){ openThread = null; renderThread(); });

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible'){ markRead(); if (polling) pollTick(); }
    });

    /* ---------- boot ---------- */
    loadHistory(cur);
    loadBoard();
    connect();
  }
  boot();
})();
</script>
