<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet pass art &middot; The AI Homebrew Club</title>
<meta name="robots" content="noindex">
<style>
  /* The pictures on the Wallet pass, drawn in the street-poster brand so they match the home page
     and the calling card. ?part=strip is the banner across the pass (375 x 123 points): the paper
     field, the shout and the 1940 scrap. ?part=logo is the club's name for the pass header
     (160 x 50 points), white on the pass's charcoal. tools/wallet/render.sh screenshots both at 3x. */
  @font-face{font-family:'Epilogue';font-style:normal;font-weight:100 900;src:url(../../assets/fonts/epilogue.woff2) format('woff2')}
  html,body{margin:0; font-family:'Epilogue','Helvetica Neue',Arial,sans-serif}
  .part{display:none}
  body.strip .strip, body.logo .logo{display:block}

  .strip{position:relative; width:375px; height:123px; overflow:hidden; background:#F2F2EF; color:#1B1B1B}
  .strip .shout{position:absolute; left:15px; top:14px; font-weight:900; font-size:37px; line-height:.86; letter-spacing:-.045em; white-space:nowrap}
  .strip .scrap{position:absolute; left:258px; top:14px; width:96px; height:128px; margin:0; transform:rotate(5deg); overflow:hidden; border-radius:50% 50% 0 0 / 38% 38% 0 0; background:#2A2A2A}
  .strip .scrap img{width:100%; height:100%; object-fit:cover; object-position:74% 62%; display:block}

  .logo{width:160px; height:50px; background:#191919; color:#fff; position:relative}
  .logo span{position:absolute; left:0; top:50%; transform:translateY(-50%); font-weight:800; font-size:13px; letter-spacing:-.02em; white-space:nowrap}
</style>
</head>
<body>
<div class="part strip">
  <div class="shout">AI for your<br>everyday<br>life</div>
  <figure class="scrap"><img src="../../assets/caribou-maine.jpg" alt=""></figure>
</div>
<div class="part logo"><span>The AI Homebrew Club</span></div>
<script>
  document.body.className = new URLSearchParams(location.search).get('part') === 'logo' ? 'logo' : 'strip';
</script>
</body>
</html>
