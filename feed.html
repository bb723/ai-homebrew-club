<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The AI Homebrew Club &middot; The Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="The feed &middot; The AI Homebrew Club">
<meta property="og:description" content="Club news between meetups. Members only.">
<meta property="og:image" content="https://aihomebrewclub.com/invite-card.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/club.css">
</head>
<body>

<!-- ===================== GATE ===================== -->
<div class="gate" id="gate">
  <div class="gate-card" id="gateCard">
    <span class="logo" data-size="90" aria-hidden="true"></span>
    <h2>Friends only, for now</h2>
    <p>This is a working preview of the club deck. Tell us who you are and the secret word.</p>
    <input id="gName" type="text" placeholder="Your name" autocomplete="off" aria-label="Your name">
    <input id="gPass" type="password" placeholder="Secret word" autocomplete="off" aria-label="Secret word">
    <p class="err" id="gErr" role="alert"></p>
    <button id="gGo">Come on in</button>
  </div>
</div>

<div class="deck" id="deck">
<style>
  /* feed-only styles: this block ships only with feed.html, so bare overrides are safe */
  html{scroll-snap-type:none}
  .slide{min-height:100svh; display:block; padding:4px clamp(12px,3vw,20px) 80px; background:var(--w-cream)}
  .sheet{width:min(640px,100%); margin:0 auto; gap:0}
  #s1 .sheet{padding-top:clamp(56px,8vh,88px)}

  .post{
    background:var(--card); border:1px solid var(--edge); border-radius:18px;
    box-shadow:var(--shadow); padding:16px 18px 10px; margin:14px 0;
  }
  .phead{display:flex; align-items:center; gap:11px; margin-bottom:8px}
  .avatar{
    width:44px; height:44px; border-radius:50%; flex:none;
    display:grid; place-items:center; font-weight:800; font-size:1.02rem;
    font-family:var(--font-body); color:var(--paper);
  }
  .c0{background:var(--teal)} .c1{background:var(--sky)} .c2c{background:var(--berry)}
  .c3{background:var(--lemon); color:#3B3227} .c4{background:var(--tangerine)}
  .pwho{min-width:0}
  .pwho b{display:block; font-size:.98rem; line-height:1.25}
  .pmeta{font-size:.8rem; color:var(--ink-soft); font-weight:700}
  .pill{
    margin-left:auto; flex:none; background:var(--lemon); color:#3B3227;
    border-radius:999px; padding:3px 11px; font-size:.68rem; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .ptitle{font-family:var(--font-display); font-weight:800; font-size:1.22rem; line-height:1.2; margin:0 0 6px}
  .pbody{font-size:.96rem}
  .pbody p{margin:0 0 9px}
  .pbody ul{margin:0 0 9px; padding-left:20px}
  .pbody li{margin-bottom:3px}
  .pmore{display:none; border-left:3px solid var(--edge); padding-left:14px; margin:4px 0 8px}
  .post.open .pmore{display:block}
  .morebtn{
    background:none; border:none; padding:0 0 8px; cursor:pointer;
    font-family:var(--font-body); font-weight:800; font-size:.85rem; color:var(--teal-deep);
  }
  .morebtn::before{content:"\25B8  "; font-size:.75rem}
  .post.open .morebtn::before{content:"\25BE  "}
  .pfoot{
    border-top:2px dashed var(--edge); padding-top:7px; margin-top:2px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:baseline;
    font-size:.78rem; color:var(--ink-soft); font-weight:700;
  }
  .tag{color:var(--teal-deep); font-weight:800}
  .delbtn{
    margin-left:auto; background:none; border:none; padding:0; cursor:pointer;
    font-family:var(--font-body); font-weight:700; font-size:.76rem; color:var(--ink-soft);
  }
  .delbtn:hover{color:var(--tangerine)}

  /* thread drill-in, as a conversation */
  .msg{
    max-width:88%; padding:10px 13px; border-radius:15px; margin:9px 0;
    border:1px solid var(--edge); font-size:.92rem;
  }
  .msg .m{font-size:.7rem; color:var(--ink-soft); margin-bottom:4px; font-weight:800; letter-spacing:.04em; text-transform:uppercase}
  .msg p{margin:0 0 8px}
  .msg p:last-child{margin-bottom:0}
  .msg ul{margin:6px 0 8px; padding-left:18px}
  .them{background:var(--w-sky); border-bottom-left-radius:5px}
  .me{background:var(--w-mint); margin-left:auto; border-bottom-right-radius:5px}

  /* profile header */
  .profile{text-align:center; padding:16px 18px 14px}
  .profile .avatar{width:84px; height:84px; margin:0 auto 8px; background:var(--card); border:2px solid var(--edge)}
  .profile h1{font-size:clamp(1.7rem,4vw,2.3rem); line-height:1.1}
  .profile .pmeta{margin-top:4px}
  .pstats{display:flex; justify-content:center; gap:18px; margin:10px 0 2px; font-weight:800; font-size:.88rem}
  .pstats span b{color:var(--tangerine)}
  .exportbtn{
    margin-top:10px; display:inline-flex; align-items:center; gap:8px;
    background:var(--card); color:var(--ink); border:2px solid var(--ink);
    border-radius:999px; padding:8px 18px; font-family:var(--font-body);
    font-weight:800; font-size:.84rem; letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; box-shadow:3px 3px 0 var(--ink);
  }
  .exportbtn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}

  /* composer */
  .composer{padding:14px 16px 12px}
  .composer .row{display:flex; gap:11px; align-items:flex-start}
  .composer textarea{
    flex:1; min-height:58px; resize:vertical; border:1px solid var(--edge);
    border-radius:12px; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:.95rem; line-height:1.5; padding:10px 12px;
  }
  .composer textarea:focus{outline:2px solid var(--teal)}
  .crow{display:flex; align-items:center; gap:10px; margin-top:9px; padding-left:55px}
  .postbtn{
    margin-left:auto; background:var(--teal); color:var(--paper); border:none;
    border-radius:999px; padding:8px 22px; font-family:var(--font-body);
    font-weight:800; font-size:.86rem; letter-spacing:.05em; text-transform:uppercase; cursor:pointer;
  }
  .postbtn:disabled{opacity:.45; cursor:default}
  .chint{font-size:.76rem; color:var(--ink-soft); font-weight:700}
  .feedstate{text-align:center; color:var(--ink-soft); font-weight:700; font-size:.85rem; padding:22px 0}
</style>

<!-- the whole feed is one slide: profile header, composer, then posts from the server -->
<section class="slide" id="s1" data-title="The feed">
  <div class="sheet">
    <div class="post profile noexport">
      <span class="avatar"><span class="logo" data-size="58"></span></span>
      <h1>The feed</h1>
      <p class="pmeta">The AI Homebrew Club &middot; what happened, and who said yes</p>
      <div class="pstats" id="feedStats"></div>
      <button class="exportbtn" id="exportFeed" type="button">&#8681; Export the feed</button>
    </div>

    <div class="post composer noexport">
      <div class="row">
        <span class="avatar" id="composerAv">?</span>
        <textarea id="composerText" maxlength="4000" placeholder="What happened? Post it to the club."></textarea>
      </div>
      <div class="crow">
        <span class="chint">Posts are shared with everyone behind the gate.</span>
        <button class="postbtn" id="composerGo" type="button">Post</button>
      </div>
    </div>

    <div class="post noexport" id="tableCard" hidden>
      <div class="phead">
        <span class="avatar av-club">&#9749;</span>
        <span class="pwho"><b>The table</b><span class="pmeta" id="tableMeta">who's coming</span></span>
      </div>
      <div class="pbody" id="tableBody"></div>
    </div>

    <div id="feedPosts"><div class="feedstate">Pouring the coffee&hellip;</div></div>
  </div>
</section>

<script>
(function(){
  'use strict';
  function boot(){
    if (!window.AIHC){ setTimeout(boot, 50); return; }
    var A = window.AIHC;
    var POSTS_URL = String(A.sync || '').replace(/\/notes\b.*$/, '/posts');
    if (!/\/posts$/.test(POSTS_URL)) return; /* no backend configured: leave the loading note */
    var POLL_MS = 25000;
    var posts = [];
    var openIds = {}; /* which posts are drilled open, survives re-render */

    function esc(s){ var d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

    /* tiny markup: **bold**, "- " list lines, bare urls, blank-line paragraphs */
    function md(t){
      var out = [], list = null;
      String(t).split('\n').forEach(function(raw){
        var ln = esc(raw)
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
          .replace(/(https?:\/\/[^\s<]+)/g, function(u){
            return '<a href="' + u + '" target="_blank" rel="noopener">' + u.replace(/^https?:\/\//, '') + '</a>';
          });
        if (/^- /.test(raw)){
          if (!list){ list = []; out.push(list); }
          list.push(ln.replace(/^- /, ''));
        } else {
          list = null;
          if (raw.trim()) out.push('<p>' + ln + '</p>');
        }
      });
      return out.map(function(x){
        return Array.isArray(x) ? '<ul><li>' + x.join('</li><li>') + '</li></ul>' : x;
      }).join('');
    }

    function avClass(name){
      var n = String(name).toLowerCase();
      if (n === 'the club') return 'c4';
      var h = 0;
      for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
      return ['c0', 'c1', 'c2c', 'c3'][h % 4];
    }
    function avGlyph(name){
      return String(name).toLowerCase() === 'the club' ? '☕' : esc(String(name).trim().charAt(0).toUpperCase());
    }
    function when(ts){
      var d = new Date(ts);
      if (isNaN(d)) return '';
      var day = d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
      var tm = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).toLowerCase();
      return day + ' · ' + tm;
    }

    function renderMore(p){
      if (p.kind === 'thread'){
        var data = null;
        try { data = JSON.parse(p.more); } catch(e){}
        if (!data || !data.messages) return '';
        return data.messages.map(function(m){
          return '<div class="msg ' + (m.side === 'me' ? 'me' : 'them') + '">' +
            '<div class="m">' + esc(m.meta) + '</div>' + md(m.text) + '</div>';
        }).join('');
      }
      return md(p.more);
    }

    function render(){
      var box = document.getElementById('feedPosts');
      if (!posts.length){
        box.innerHTML = '<div class="feedstate">Nothing on the feed yet. Be the first to post.</div>';
      } else {
        box.innerHTML = posts.map(function(p){
          var hasMore = p.more && String(p.more).trim();
          var moreLabel = p.kind === 'thread'
            ? 'Read the thread'
            : 'Show more';
          if (p.kind === 'thread'){
            try { moreLabel += ' (' + JSON.parse(p.more).messages.length + ' messages)'; } catch(e){}
          }
          var v = A.viewer();
          var mine = v && v.name === p.name && p.id.indexOf('seed-') !== 0;
          return '<article class="post' + (openIds[p.id] ? ' open' : '') + '" data-id="' + esc(p.id) + '">' +
            '<div class="phead">' +
              '<span class="avatar ' + avClass(p.name) + '">' + avGlyph(p.name) + '</span>' +
              '<span class="pwho"><b>' + esc(p.name) + '</b><span class="pmeta">' + when(p.ts) + '</span></span>' +
              (p.notable ? '<span class="pill">&#9733; Notable</span>' : '') +
            '</div>' +
            '<div class="pbody">' +
              (p.title ? '<div class="ptitle">' + esc(p.title) + '</div>' : '') +
              md(p.body) +
              (hasMore ? '<button class="morebtn" type="button">' + moreLabel + '</button>' +
                         '<div class="pmore">' + renderMore(p) + '</div>' : '') +
            '</div>' +
            (p.tags || mine ?
              '<div class="pfoot">' +
                String(p.tags || '').split(/\s+/).filter(Boolean).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
                (mine ? '<button class="delbtn" type="button">delete</button>' : '') +
              '</div>' : '') +
          '</article>';
        }).join('');
      }
      var stats = document.getElementById('feedStats');
      var notable = posts.filter(function(p){ return p.notable; }).length;
      var newest = posts.length ? when(posts[0].ts).split(' · ')[0] : '—';
      stats.innerHTML = '<span><b>' + posts.length + '</b> posts</span>' +
        '<span><b>' + notable + '</b> notable</span>' +
        '<span>updated <b>' + esc(newest) + '</b></span>';
      var v = A.viewer();
      document.getElementById('composerAv').textContent = v ? avGlyph(v.name) : '?';
      document.getElementById('composerAv').className = 'avatar ' + (v ? avClass(v.name) : 'c0');
    }

    /* clicks: drill-in + delete (buttons are ignored by the note-pinning layer) */
    document.getElementById('feedPosts').addEventListener('click', function(ev){
      var post = ev.target.closest('.post');
      if (!post) return;
      if (ev.target.closest('.morebtn')){
        var id = post.getAttribute('data-id');
        openIds[id] = !openIds[id];
        post.classList.toggle('open', !!openIds[id]);
      }
      if (ev.target.closest('.delbtn')){
        var did = post.getAttribute('data-id');
        if (!window.confirm('Delete this post for everyone?')) return;
        fetch(POSTS_URL, {
          method: 'POST', headers: {'Content-Type': 'text/plain'},
          body: JSON.stringify({secret: A.secret, action: 'delete', id: did})
        }).then(function(){ load(); });
        posts = posts.filter(function(p){ return p.id !== did; });
        render();
      }
    });

    function load(){
      fetch(POSTS_URL + '?secret=' + encodeURIComponent(A.secret))
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (d && d.posts){ posts = d.posts; render(); }
        })
        .catch(function(){ /* keep whatever is on screen */ });
      loadTable();
    }

    /* the table: who's coming to upcoming meetups (names only; contacts stay in the admin console) */
    var BASE = POSTS_URL.replace(/\/posts$/, '');
    function loadTable(){
      Promise.all([
        fetch(BASE + '/events').then(function(r){ return r.json(); }),
        fetch(BASE + '/attendees?secret=' + encodeURIComponent(A.secret)).then(function(r){ return r.json(); })
      ]).then(function(res){
        var events = ((res[0] && res[0].events) || []).filter(function(e){ return e.status === 'upcoming'; })
          .sort(function(a, b){ return a.sort_date < b.sort_date ? -1 : 1; });
        var att = (res[1] && res[1].attendees) || [];
        if (!events.length){ document.getElementById('tableCard').hidden = true; return; }
        document.getElementById('tableCard').hidden = false;
        document.getElementById('tableBody').innerHTML = events.map(function(e){
          var mine = att.filter(function(a){ return a.event === e.id; });
          var seats = mine.filter(function(a){ return a.status === 'seat'; });
          var waits = mine.filter(function(a){ return a.status === 'waitlist'; });
          function names(list){
            return list.map(function(a){ return esc(a.name) + (a.biz ? ' (' + esc(a.biz) + ')' : ''); }).join(', ');
          }
          return '<p><b>' + esc(e.when) + '</b> · ' + esc(e.location) + '</p>' +
            (seats.length
              ? '<p>At the table (' + seats.length + ' of ' + e.capacity + '): ' + names(seats) + '</p>'
              : '<p>No seats claimed yet. Be the first.</p>') +
            (waits.length ? '<p class="quiet">Waiting for a seat: ' + names(waits) + '</p>' : '') +
            (e.left > 0
              ? '<p class="quiet">' + e.left + ' seat' + (e.left === 1 ? '' : 's') + ' open · <a href="rsvp.html?event=' + encodeURIComponent(e.id) + '">save one</a></p>'
              : '<p class="quiet">Full · <a href="rsvp.html?event=' + encodeURIComponent(e.id) + '">join the waitlist</a></p>');
        }).join('<hr style="border:none; border-top:2px dashed var(--edge); margin:10px 0">');
      }).catch(function(){ /* leave the card as is */ });
    }

    /* composer */
    var ta = document.getElementById('composerText');
    var go = document.getElementById('composerGo');
    go.addEventListener('click', function(){
      var text = ta.value.trim();
      if (!text) return;
      var v = A.viewer();
      if (!v){ A.toast('Sign in first.'); return; }
      var p = {
        id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: v.name, title: '', body: text, more: '', kind: 'update',
        tags: '', notable: false, ts: new Date().toISOString()
      };
      posts.unshift(p); render(); ta.value = '';
      go.disabled = true;
      fetch(POSTS_URL, {
        method: 'POST', headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({secret: A.secret, action: 'add', post: p})
      }).then(function(r){
        go.disabled = false;
        if (r.ok) A.toast('Posted to the club.');
        else A.toast('Could not reach the server; post may not have saved.');
      }).catch(function(){
        go.disabled = false;
        A.toast('Could not reach the server; post may not have saved.');
      });
    });

    /* export the entire feed as a standalone html file */
    var XCSS = [
      ':root{--ink:#3B3227; --ink-soft:#675B49; --paper:#F8F1E3; --card:#FFFCF4;',
      '--teal:#557C4B; --teal-deep:#3E5F37; --tangerine:#C1552F; --sky:#567F9E;',
      '--berry:#8F5874; --lemon:#E7B84E; --w-sky:#E2EAEE; --w-mint:#E8EDD9;',
      '--edge:rgba(59,50,39,.18)}',
      'body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,"Times New Roman",serif; font-size:16px; line-height:1.55; padding:32px 16px}',
      'main{max-width:640px; margin:0 auto}',
      'header{text-align:center; margin-bottom:18px}',
      'header h1{font-size:1.9rem; margin:0}',
      'header p{color:var(--ink-soft); font-size:.85rem; margin:6px 0 0}',
      'a{color:var(--teal-deep)}',
      '.post{background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:16px 18px 10px; margin:14px 0; page-break-inside:avoid}',
      '.phead{display:flex; align-items:center; gap:11px; margin-bottom:8px}',
      '.avatar{width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:var(--paper); font-family:Arial,sans-serif}',
      '.c0{background:var(--teal)} .c1{background:var(--sky)} .c2c{background:var(--berry)}',
      '.c3{background:var(--lemon); color:#3B3227} .c4{background:var(--tangerine)}',
      '.pwho b{display:block; font-size:.98rem} .pmeta{font-size:.8rem; color:var(--ink-soft)}',
      '.pill{margin-left:auto; flex:none; background:var(--lemon); color:#3B3227; border-radius:999px; padding:3px 11px; font-size:.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase}',
      '.ptitle{font-weight:700; font-size:1.18rem; margin:0 0 6px}',
      '.pbody p{margin:0 0 9px} .pbody ul{margin:0 0 9px; padding-left:20px} .pbody li{margin-bottom:3px}',
      '.pmore{display:block; border-left:3px solid var(--edge); padding-left:14px; margin:4px 0 8px}',
      '.morebtn,.delbtn{display:none}',
      '.pfoot{border-top:2px dashed var(--edge); padding-top:7px; display:flex; gap:12px; flex-wrap:wrap; font-size:.76rem; color:var(--ink-soft)}',
      '.tag{color:var(--teal-deep); font-weight:700}',
      '.msg{max-width:88%; padding:10px 13px; border-radius:14px; margin:9px 0; border:1px solid var(--edge); font-size:.92rem}',
      '.msg .m{font-size:.68rem; color:var(--ink-soft); margin-bottom:4px; font-weight:700; letter-spacing:.04em; text-transform:uppercase}',
      '.msg p{margin:0 0 8px} .msg p:last-child{margin:0} .msg ul{margin:6px 0 8px; padding-left:18px}',
      '.them{background:var(--w-sky); border-bottom-left-radius:5px}',
      '.me{background:var(--w-mint); margin-left:auto; border-bottom-right-radius:5px}',
      '@media print{body{padding:0}}'
    ].join('\n');
    document.getElementById('exportFeed').addEventListener('click', function(){
      var today = new Date();
      var stamp = today.toISOString().slice(0, 10);
      var nice = today.toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'});
      var out = [];
      document.querySelectorAll('#feedPosts .post').forEach(function(p){
        var c = p.cloneNode(true);
        c.classList.add('open');
        out.push(c.outerHTML);
      });
      var html = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
        '<title>The AI Homebrew Club · The Feed · ' + stamp + '</title>\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
        '<style>\n' + XCSS + '\n</style>\n</head>\n<body>\n<main>\n' +
        '<header>\n<h1>The AI Homebrew Club · The Feed</h1>\n' +
        '<p>What happened, and who said yes. Exported ' + nice + ' from aihomebrewclub.com/feed.html</p>\n</header>\n' +
        out.join('\n') +
        '\n</main>\n</body>\n</html>\n';
      var blob = new Blob([html], {type: 'text/html'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'aihc-feed-' + stamp + '.html';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });

    load();
    setInterval(load, POLL_MS);
  }
  boot();
})();
</script>

</div><!-- /deck -->



<script>window.AIHC_PAGE = {deck: 'feed'};</script>
<script src="assets/config.js"></script>
<script src="assets/club.js"></script>
</body>
</html>
