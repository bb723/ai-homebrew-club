<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The recipe box &middot; The AI Homebrew Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="The recipe box">
<meta property="og:description" content="Steal-this-prompts from the AI Homebrew Club: real fixes for real small-business problems. Free, and they always will be.">
<meta property="og:image" content="https://aihomebrewclub.com/invite-card.png">
<meta property="og:url" content="https://aihomebrewclub.com/recipes.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/site.css">
<style>
  body{padding-bottom:60px; position:relative}
  h1{font-weight:800; font-size:clamp(2.4rem,7.5vw,3.6rem); line-height:1.05; margin:18px 0 4px; letter-spacing:-.01em}
  h1::after{content:""; display:block; width:126px; height:12px; margin-top:12px; background:var(--squig) no-repeat left center}
  .kicker{font-family:var(--font-display); font-style:italic; font-weight:600; color:var(--ink-soft); font-size:1.1rem; margin:0 0 20px}
  h2{font-weight:800; font-size:clamp(1.35rem,3.6vw,1.8rem); margin:32px 0 6px}
  .recipe{
    background:var(--card); border:1px solid var(--edge); border-radius:18px;
    box-shadow:var(--shadow); padding:18px 20px 14px; margin:14px 0;
  }
  .recipe h3{font-weight:800; font-size:1.2rem; margin:0 0 4px}
  .why{color:var(--ink-soft); font-weight:700; font-size:.92rem; margin:0 0 12px}
  .steal{
    background:var(--paper); border:1px solid var(--edge); border-radius:12px;
    padding:12px 14px; font-family:var(--font-hand); font-size:1.32rem; line-height:1.4;
    background-image:repeating-linear-gradient(transparent 0 calc(1.4em - 1px), var(--edge) calc(1.4em - 1px) 1.4em);
  }
  .rfoot{display:flex; gap:12px; align-items:baseline; margin-top:10px; flex-wrap:wrap}
  .notes{color:var(--ink-soft); font-size:.86rem; font-weight:700; flex:1; min-width:200px}
  .byline{color:var(--ink-soft); font-size:.78rem; font-weight:700}
  .empty{color:var(--ink-soft); font-weight:700}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a href="index.html"><span class="logo" data-size="40"></span><span>The AI Homebrew Club</span></a>
    <a class="evlink" href="events.html">Events</a>
    <a class="members" href="members.html">Members</a>
  </header>

  <h1>The recipe box.</h1>
  <p class="kicker">Steal these. That is what they are for. Paste one into Claude or ChatGPT, swap in your own details, and take the hour back.</p>

  <div id="box"><p class="empty">Opening the box&hellip;</p></div>

  <footer>
    Every meetup adds recipes to the box. <a href="waterville.html">Come to the next one.</a><br>
    <a href="index.html">aihomebrewclub.com</a>
  </footer>
</div>

<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  'use strict';
  var BASE = window.AIHC_CONFIG.API_BASE;
  var esc = window.AIHC_UI.esc;

  function render(recipes){
    var box = document.getElementById('box');
    if (!recipes.length){
      box.innerHTML = '<p class="empty">The box is empty. The first meetup fills it.</p>';
      return;
    }
    var cats = [];
    recipes.forEach(function(r){ if (cats.indexOf(r.category) === -1) cats.push(r.category); });
    box.innerHTML = cats.map(function(c){
      return '<h2>' + esc(c) + '</h2>' + recipes.filter(function(r){ return r.category === c; }).map(function(r){
        return '<div class="recipe">' +
          '<h3>' + esc(r.title) + '</h3>' +
          (r.problem ? '<p class="why">' + esc(r.problem) + '</p>' : '') +
          '<div class="steal" data-prompt="' + esc(r.prompt) + '">' + esc(r.prompt) + '</div>' +
          '<div class="rfoot">' +
            (r.notes ? '<span class="notes">' + esc(r.notes) + '</span>' : '<span class="notes"></span>') +
            (r.name ? '<span class="byline">from ' + esc(r.name) + '</span>' : '') +
            '<button class="copybtn" type="button">Copy the prompt</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }).join('');
  }

  document.getElementById('box').addEventListener('click', function(ev){
    var b = ev.target.closest('.copybtn');
    if (!b) return;
    var steal = b.closest('.recipe').querySelector('.steal');
    var text = steal.textContent;
    function done(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy the prompt'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){}
      ta.remove();
    }
  });

  fetch(BASE + '/recipes')
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.recipes) render(d.recipes); })
    .catch(function(){
      document.getElementById('box').innerHTML = '<p class="empty">Could not reach the box. Try again in a minute.</p>';
    });
})();
</script>
</body>
</html>
