name: Render cards

# card.html, rendered to cards/<event>.png for every upcoming meetup, so roster notes can carry
# the card and anyone can text aihomebrewclub.com/cards/<id>.png. Runs every morning ahead of
# the 9 am Maine sends, on demand, and when the card's design changes. Commits only when a card
# actually changed; pushes by the Actions token do not re-trigger workflows, so no loops.

on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - card.html
      - assets/**
      - .github/scripts/render-cards.js

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install puppeteer (outside the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          cd "$RUNNER_TEMP/render"
          npm init -y >/dev/null
          npm install --no-audit --no-fund puppeteer@24.43.1

      - name: Render the cards
        env:
          NODE_PATH: ${{ runner.temp }}/render/node_modules
        run: node .github/scripts/render-cards.js

      - name: Commit what changed
        run: |
          git add -A cards
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Cards: render the upcoming meetups"
          git pull --rebase origin master
          git push origin HEAD:master
